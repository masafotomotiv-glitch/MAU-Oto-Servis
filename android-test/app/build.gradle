plugins {
    id 'com.android.application'
}

android {
    // Web arayuzunu APK icine de paketle. Boylece internet yokken ayni HTML/JS/SVG dosyalari yerelden acilir.
    def offlineAssetsDir = layout.buildDirectory.dir("generated/offlineAssets")
    sourceSets {
        main {
            assets.srcDir offlineAssetsDir
        }
    }

    namespace 'com.mau.otoservis'
    compileSdk 36

    defaultConfig {
        applicationId "com.mau.otoservis.app"
        minSdk 26
        targetSdk 36
        versionCode 17
        versionName "1.0-rc.8"
    }

    signingConfigs {
        release {
            def keyStorePath = System.getenv("MAU_SIGNING_KEYSTORE")
            if (keyStorePath) {
                storeFile file(keyStorePath)
                storePassword System.getenv("MAU_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("MAU_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("MAU_SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled on-device OCR: ilk kullanımda model indirmesi gerektirmez.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}


tasks.register("prepareOfflineAssets", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "*.html"
        include "*.js"
        include "*.svg"
        include "update.json"
    }
    into(layout.buildDirectory.dir("generated/offlineAssets"))
}

preBuild.dependsOn("prepareOfflineAssets")
