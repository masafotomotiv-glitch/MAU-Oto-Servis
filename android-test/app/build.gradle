plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mau.otoservis'
    compileSdk 36

    defaultConfig {
        applicationId "com.mau.otoservis.ocrstable"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0-ocr-stable"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled on-device OCR: ilk kullanımda model indirmesi gerektirmez.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
