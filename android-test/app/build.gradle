plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mau.otoservis'
    compileSdk 36

    defaultConfig {
        applicationId "com.mau.otoservis"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1-tablet-test"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
