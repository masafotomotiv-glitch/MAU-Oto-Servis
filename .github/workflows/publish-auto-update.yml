name: Publish MAU Auto Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-test/app/build.gradle"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Stable pilot signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mau-ocr-debug-keystore-v1

      - name: Create pilot signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=MAU,C=TR" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Read version
        id: version
        run: |
          CODE=$(grep -E 'versionCode ' android-test/app/build.gradle | awk '{print $2}')
          NAME=$(grep -E 'versionName ' android-test/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle -p android-test assembleDebug --stacktrace

      - name: Prepare APK and SHA-256
        id: apk
        run: |
          cp android-test/app/build/outputs/apk/debug/app-debug.apk MAU-Oto-Servis-latest.apk
          SHA=$(sha256sum MAU-Oto-Servis-latest.apk | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish stable update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mau-latest --cleanup-tag -y || true
          gh release create mau-latest MAU-Oto-Servis-latest.apk \
            --target "${{ github.sha }}" \
            --title "MAU Oto Servis ${{ steps.version.outputs.name }}" \
            --notes "MAU Oto Servis otomatik güncelleme paketi." \
            --latest

      - name: Update update.json
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("update.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          data.update({
              "enabled": True,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": "https://github.com/masafotomotiv-glitch/MAU-Oto-Servis/releases/download/mau-latest/MAU-Oto-Servis-latest.apk",
              "sha256": os.environ["APK_SHA"],
              "mandatory": True,
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY

      - name: Commit update manifest
        run: |
          git config user.name "MAU Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet && exit 0
          git commit -m "Yayın manifestini güncelle [auto-update]"
          git push origin HEAD:main
