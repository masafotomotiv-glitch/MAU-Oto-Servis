name: Publish MAU Auto Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-test/app/build.gradle"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore MAU production signing key
        env:
          MAU_RELEASE_KEYSTORE_BASE64: ${{ secrets.MAU_RELEASE_KEYSTORE_BASE_64 }}
        run: |
          test -n "$MAU_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$MAU_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mau-production.p12"
          chmod 600 "$RUNNER_TEMP/mau-production.p12"
          test -s "$RUNNER_TEMP/mau-production.p12"

      - name: Read version
        id: version
        run: |
          CODE=$(grep -E 'versionCode ' android-test/app/build.gradle | awk '{print $2}')
          NAME=$(grep -E 'versionName ' android-test/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build production release APK
        env:
          MAU_SIGNING_KEYSTORE: ${{ runner.temp }}/mau-production.p12
          MAU_SIGNING_STORE_PASSWORD: ${{ secrets.MAU_RELEASE_STORE_PASSWORD }}
          MAU_SIGNING_KEY_ALIAS: ${{ secrets.MAU_RELEASE_KEY_ALIAS }}
          MAU_SIGNING_KEY_PASSWORD: ${{ secrets.MAU_RELEASE_KEY_PASSWORD }}
        run: gradle -p android-test assembleRelease --stacktrace

      - name: Verify production signing certificate
        run: |
          APK="android-test/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/SHA-256 digest/ {print tolower($2); exit}' | tr -d ':')
          EXPECTED="a28982bd4d43e2daaf2fe0f1e9356fbdf2513dfb7a87a43afb62b18a153d324e"
          echo "Production signing certificate: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Prepare APK and SHA-256
        id: apk
        run: |
          cp android-test/app/build/outputs/apk/release/app-release.apk MAU-Oto-Servis-latest.apk
          SHA=$(sha256sum MAU-Oto-Servis-latest.apk | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload production release APK
        uses: actions/upload-artifact@v4
        with:
          name: MAU-Oto-Servis-Production-Release
          path: MAU-Oto-Servis-latest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish stable update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mau-latest --cleanup-tag -y || true
          gh release create mau-latest MAU-Oto-Servis-latest.apk \
            --target "${{ github.sha }}" \
            --title "MAU Oto Servis ${{ steps.version.outputs.name }}" \
            --notes "MAU Oto Servis otomatik güncelleme paketi." \
            --latest

      - name: Update update.json
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("update.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          data.update({
              "enabled": True,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": "https://github.com/masafotomotiv-glitch/MAU-Oto-Servis/releases/download/mau-latest/MAU-Oto-Servis-latest.apk",
              "sha256": os.environ["APK_SHA"],
              "mandatory": True,
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY

      - name: Commit update manifest
        run: |
          git config user.name "MAU Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet && exit 0
          git commit -m "Yayın manifestini güncelle [auto-update]"
          git push origin HEAD:main
