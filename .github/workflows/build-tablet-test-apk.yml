name: Build MAU Tablet Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-test/**"
      - ".github/workflows/build-tablet-test-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle -p android-test assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-test/app/build/outputs/apk/debug/app-debug.apk MAU-Oto-Servis-Tablet-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAU-Oto-Servis-Tablet-Test-APK
          path: MAU-Oto-Servis-Tablet-Test.apk
          if-no-files-found: error
          retention-days: 7
