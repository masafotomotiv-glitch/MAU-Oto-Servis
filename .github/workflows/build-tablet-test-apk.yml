name: Build MAU Oto Servis APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-test/**"
      - ".github/workflows/build-tablet-test-apk.yml"
      - "Raporlar.html"
      - "Yedekleme.html"
      - "HasarSigorta.html"
      - "EkspertizDetay.html"
      - "TeslimFatura.html"
      - "Teklifler.html"
      - "EksperArsivi.html"
  pull_request:
    paths:
      - "android-test/**"
      - ".github/workflows/build-tablet-test-apk.yml"
      - "Raporlar.html"
      - "Yedekleme.html"
      - "HasarSigorta.html"
      - "EkspertizDetay.html"
      - "TeslimFatura.html"
      - "Teklifler.html"
      - "EksperArsivi.html"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate report and backup web code
        run: |
          node --check auth.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile, sys

          files = [
              "Giris.html",
              "Hesabim.html",
              "Cikis.html",
              "index.html",
              "Raporlar.html",
              "Yedekleme.html",
              "HasarSigorta.html",
              "EkspertizDetay.html",
              "TeslimFatura.html",
              "Faturalar.html",
              "FaturaArsiv.html",
              "GelenFatura.html",
              "Islemler.html",
              "Teklifler.html",
              "EksperArsivi.html",
          ]

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(k.lower()=="src" for k,v in attrs)
                      self.parts = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=="script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False
                      self.parts = []

          for file in files:
              p = Scripts()
              p.feed(Path(file).read_text(encoding="utf-8"))
              for i, js in enumerate(p.scripts, 1):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as tmp:
                      tmp.write(js)
                      name = tmp.name
                  r = subprocess.run(["node", "--check", name], capture_output=True, text=True)
                  if r.returncode:
                      print(f"JS syntax error: {file} script {i}")
                      print(r.stderr)
                      sys.exit(1)

          checks = {
              "Raporlar.html": ["saveXlsx", "printPage", "shareText"],
              "Yedekleme.html": ["MAU-FULL-BACKUP-1", "beginBinarySave", "inspectFullBackup", "restoreFullBackup"],
              "HasarSigorta.html": ["printReportNative", "MAUAndroid.printPage"],
              "EkspertizDetay.html": ["printReportNative", "MAUAndroid.printPage"],
              "TeslimFatura.html": ["MAUAndroid.printPage", "preparedInvoice", "closeForInvoice"],
              "Faturalar.html": ["Belge Bekleyen", "GelenFatura.html", "FaturaArsiv.html"],
              "FaturaArsiv.html": ["paidAmount", "remainAmount", "KDV %"],
              "GelenFatura.html": ["onRuhsatScanResult", "Gelen Faturayı Kaydet"],
              "Islemler.html": ["kdvOrani", "discountTotal"],
              "Teklifler.html": ["MAUAndroid.printPage"],
              "EksperArsivi.html": ["MAUAndroid.printPage"],
          }
          for file, needles in checks.items():
              text = Path(file).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      print(f"Missing required integration: {file}: {needle}")
                      sys.exit(1)
          print("Web output/backup checks passed.")
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mau-ocr-debug-keystore-v1

      - name: Create debug signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=MAU,C=TR" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build debug APK
        run: gradle -p android-test assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-test/app/build/outputs/apk/debug/app-debug.apk MAU-Oto-Servis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAU-Oto-Servis-APK
          path: MAU-Oto-Servis.apk
          if-no-files-found: error
          retention-days: 7
