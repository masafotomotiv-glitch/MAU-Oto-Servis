<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAU Oto Servis - Teklif / Müşteri Onayı</title>
<style>
*{box-sizing:border-box}:root{--b:#0874d1;--b2:#083fa7;--g:#0a944a;--bg:#f3f6fb;--line:#d9e1ea;--muted:#64748b;--red:#b42335}
body{margin:0;font-family:Arial;background:var(--bg);color:#1f2937}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:16px}.head{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center}.back{border:0;background:#ffffff1c;color:#fff;width:42px;height:42px;border-radius:10px;font-size:22px}.title{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.86;margin-top:3px}
.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px #0000000b;margin-bottom:12px;overflow:hidden}.head2{background:#eef6ff;border-bottom:1px solid #d7e8f7;padding:13px 15px;font-weight:900;color:#075ca8}.body{padding:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:9px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;color:#4b5968;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px}textarea{min-height:74px}
.info{background:#f7fbff;border:1px solid #d7e8f7;border-radius:10px;padding:11px;font-size:12px;line-height:1.6}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{font-size:11px;text-align:left;border-bottom:1px solid #edf0f4;padding:8px}th{background:#f7f9fc}.total{margin-top:10px;text-align:right;font-size:14px;line-height:1.7}.total b{font-size:20px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:9px;padding:11px 13px;font-weight:900}.save{background:#0a8a48;color:#fff}.share{background:#e8f7ef;color:#087840}.print{background:#eaf2ff;color:#0756a5}.approve{background:#0874d1;color:#fff}.reject{background:#ffe8eb;color:#a21c2b}
.item{border:1px solid #e5eaf0;border-radius:10px;padding:12px;margin-bottom:8px}.itemTitle{font-weight:900}.meta{font-size:11px;color:var(--muted);line-height:1.55;margin-top:4px}.badge{display:inline-block;border-radius:10px;padding:4px 8px;font-size:10px;font-weight:800;background:#eaf3ff;color:#075ba8}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style><script src="lisans.js"></script>
</head><body>
<header><div class="head"><button class="back" onclick="location.href='IsEmirleri.html'">‹</button><div><div class="title">M•• MAU OTO SERVİS</div><div class="sub">Teklif · Müşteri Paylaşımı · Onay / Red Kayıt Geçmişi</div></div></div></header>
<div class="wrap">
 <div class="card"><div class="head2">İş Emrinden Teklif Oluştur</div><div class="body">
  <div class="field"><label>İş Emri</label><select id="workId" onchange="selectWork()"><option value="">İş emri seçiniz...</option></select></div>
  <div id="info" class="info">İş emri seçilmedi.</div>
  <div id="preview"></div>
  <div class="btnrow"><button class="btn save" onclick="saveQuote()">✓ Teklifi Oluştur / Güncelle</button><button class="btn share" onclick="shareCurrent()">WhatsApp / Paylaş</button><button class="btn print" onclick="printCurrent()">PDF / Yazdır</button></div>
 </div></div>
 <div class="card"><div class="head2">Müşteri Onay Kaydı</div><div class="body">
  <div class="grid">
   <div class="field"><label>Onay Yöntemi</label><select id="method"><option>WhatsApp</option><option>Telefon</option><option>SMS</option><option>E-posta</option><option>Yüz Yüze</option><option>İmzalı Form</option></select></div>
   <div class="field"><label>Onaylayan Kişi</label><input id="approvedBy"></div>
   <div class="field"><label>Onay Tarihi / Saati</label><input id="approvedAt" type="datetime-local"></div>
   <div class="field"><label>Durum</label><select id="approvalStatus"><option>Onaylandı</option><option>Kısmi Onay</option><option>Reddedildi</option></select></div>
   <div class="field full"><label>Onay / Red Notu</label><textarea id="approvalNote"></textarea></div>
  </div>
  <div class="btnrow"><button class="btn approve" onclick="recordApproval('approve')">Onayı Kaydet</button><button class="btn reject" onclick="recordApproval('reject')">Reddet</button><button class="btn print" onclick="goOperations()">İşlemlere Dön →</button></div>
 </div></div>
 <div class="card"><div class="head2">Teklifler</div><div class="body" id="list"></div></div>
</div>
<script>
const WORK_KEY="mau_is_emirleri",QUOTE_KEY="mau_teklifler";
const CLOSED_STATUSES=["Teslim Edildi","Kapalı"];
function closedLocked(w){return !!w&&CLOSED_STATUSES.includes(w.durum)&&sessionStorage.getItem("mau_isemri_unlock_"+String(w.id))!=="1"}
function blockClosed(w){if(!closedLocked(w))return false;alert("Bu iş emri kapalı ve güvenlik kilitli. İş Emirleri ekranından Güvenlik Şifresiyle Aç işlemini yapın.");location.href="IsEmirleri.html";return true}
function load(k){try{const v=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}function put(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function money(n){return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺"}
function localDateTimeValue(d=new Date()){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())}
let works=load(WORK_KEY),quotes=load(QUOTE_KEY),activeWork=null,activeQuote=null;
function nextNo(){let m=0;quotes.forEach(x=>{const n=parseInt(String(x.teklifNo||"").replace(/\D/g,""),10);if(Number.isFinite(n)&&n>m)m=n});return "TKL-"+String(m+1).padStart(5,"0")}
function fillWorks(){works=load(WORK_KEY);const visible=works.filter(w=>!closedLocked(w));document.getElementById("workId").innerHTML='<option value="">İş emri seçiniz...</option>'+visible.map(w=>'<option value="'+esc(w.id)+'">'+esc(w.isEmriNo)+' · '+esc(w.plaka)+' · '+esc(w.cariAdi||"")+'</option>').join("")}
function selectWork(){works=load(WORK_KEY);activeWork=works.find(w=>String(w.id)===String(document.getElementById("workId").value));if(activeWork&&blockClosed(activeWork))return;activeQuote=activeWork?quotes.find(q=>String(q.isEmriId)===String(activeWork.id)):null;if(!activeWork){document.getElementById("info").innerHTML="İş emri seçilmedi.";document.getElementById("preview").innerHTML="";return}document.getElementById("info").innerHTML='<b>'+esc(activeWork.isEmriNo)+' · '+esc(activeWork.plaka)+'</b><br>'+esc(activeWork.cariAdi||"-")+' · '+esc([activeWork.marka,activeWork.model].filter(Boolean).join(" ")||"-")+'<br>Müşteri talebi: '+esc(activeWork.musteriSikayeti||"-");renderPreview();const approvedBy=(activeQuote&&activeQuote.approvedBy)||activeWork.onaylayan||activeWork.cariAdi||"";document.getElementById("approvedBy").value=approvedBy;const allowed=["Onaylandı","Kısmi Onay","Reddedildi"];const current=activeQuote&&activeQuote.approvalStatus;document.getElementById("approvalStatus").value=allowed.includes(current)?current:"Onaylandı";document.getElementById("approvalNote").value=(activeQuote&&activeQuote.approvalNote)||""}
function renderPreview(){if(!activeWork)return;const ls=activeWork.iscilikler||[],ps=activeWork.parcalar||[];let h='<div class="tableWrap"><table><thead><tr><th>Tür</th><th>Açıklama</th><th>Miktar</th><th>Birim</th><th>Birim Fiyat</th><th>Tutar</th></tr></thead><tbody>';ls.forEach(x=>{h+='<tr><td>İşçilik</td><td>'+esc(x.islem||"-")+'</td><td>'+Number(x.saat||0)+'</td><td>Saat</td><td>'+money(x.birimFiyat||0)+'</td><td>'+money(Number(x.saat||0)*Number(x.birimFiyat||0))+'</td></tr>'});ps.forEach(x=>{const unit=x.birim||"Adet";h+='<tr><td>Parça</td><td>'+esc(x.ad||"-")+(x.kod?' ('+esc(x.kod)+')':'')+'</td><td>'+Number(x.adet||0)+'</td><td>'+esc(unit)+'</td><td>'+money(x.birimFiyat||0)+'</td><td>'+money(Number(x.adet||0)*Number(x.birimFiyat||0))+'</td></tr>'});h+='</tbody></table></div><div class="total">İşçilik: '+money(activeWork.iscilikToplam)+'<br>Parça: '+money(activeWork.parcaToplam)+'<br>KDV: '+money(activeWork.kdvTutar)+'<br><b>Genel Toplam: '+money(activeWork.genelToplam)+'</b></div>';document.getElementById("preview").innerHTML=h}
function snapshot(){return {iscilikler:JSON.parse(JSON.stringify(activeWork.iscilikler||[])),parcalar:JSON.parse(JSON.stringify(activeWork.parcalar||[])),iscilikToplam:Number(activeWork.iscilikToplam||0),parcaToplam:Number(activeWork.parcaToplam||0),indirim:Number(activeWork.indirim||0),kdv:Number(activeWork.kdv||0),kdvTutar:Number(activeWork.kdvTutar||0),genelToplam:Number(activeWork.genelToplam||0)}}
function saveQuote(){if(!activeWork){alert("İş emri seçiniz.");return}quotes=load(QUOTE_KEY);let q=quotes.find(x=>String(x.isEmriId)===String(activeWork.id)),snap=snapshot();if(q){Object.assign(q,snap,{durum:q.durum||"Onay Bekliyor",updatedAt:new Date().toISOString()})}else{q={id:Date.now(),teklifNo:nextNo(),isEmriId:activeWork.id,isEmriNo:activeWork.isEmriNo,kabulId:activeWork.kabulId,cariId:activeWork.cariId,cariAdi:activeWork.cariAdi,plaka:activeWork.plaka,musteriSikayeti:activeWork.musteriSikayeti,durum:"Onay Bekliyor",approvalStatus:"Onay Bekliyor",history:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),...snap};quotes.unshift(q)}put(QUOTE_KEY,quotes);activeQuote=q;renderList();alert(q.teklifNo+" teklif kaydedildi. İşçilik ve parça fiyatları bu teklif için sabitlendi.")}
function quoteText(){if(!activeWork)return"";const q=activeQuote||quotes.find(x=>String(x.isEmriId)===String(activeWork.id));const no=q?q.teklifNo:"Taslak";let s="MAU OTO SERVİS\nTeklif: "+no+"\nİş Emri: "+activeWork.isEmriNo+"\nAraç: "+activeWork.plaka+"\nMüşteri: "+(activeWork.cariAdi||"")+"\n\n";(activeWork.iscilikler||[]).forEach(x=>s+="İşçilik: "+(x.islem||"")+" | "+Number(x.saat||0)+" Saat x "+money(x.birimFiyat||0)+" = "+money(Number(x.saat||0)*Number(x.birimFiyat||0))+"\n");(activeWork.parcalar||[]).forEach(x=>{const unit=x.birim||"Adet";s+="Parça: "+(x.ad||"")+" | "+Number(x.adet||0)+" "+unit+" x "+money(x.birimFiyat||0)+" = "+money(Number(x.adet||0)*Number(x.birimFiyat||0))+"\n"});s+="\nKDV: "+money(activeWork.kdvTutar)+"\nTOPLAM: "+money(activeWork.genelToplam)+"\nOnay için servisle iletişime geçiniz.";return s}
async function shareCurrent(){if(!activeWork){alert("İş emri seçiniz.");return}if(!activeQuote)saveQuote();const text=quoteText();
 if(window.MAUAndroid&&typeof window.MAUAndroid.shareText==="function"){window.MAUAndroid.shareText(text);return}
 if(navigator.share){try{await navigator.share({title:"MAU Oto Servis Teklif",text});return}catch(e){}}
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);alert("Bu APK doğrudan paylaşımı desteklemiyor. Teklif metni panoya kopyalandı; WhatsApp'ta yapıştırabilirsiniz.");return}
 }catch(e){}
 const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta);alert("Teklif metni panoya kopyalandı; WhatsApp'ta yapıştırabilirsiniz.")}
function printCurrent(){if(!activeWork){alert("İş emri seçiniz.");return}const w=window.open("","_blank");if(!w){alert("Yazdırma penceresine izin verin.");return}w.document.write('<html><head><meta charset="UTF-8"><title>Teklif</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;text-align:left}.r{text-align:right}</style></head><body><h2>MAU OTO SERVİS</h2><h3>Teklif '+esc((activeQuote&&activeQuote.teklifNo)||"Taslak")+'</h3><p><b>'+esc(activeWork.cariAdi||"")+'</b><br>'+esc(activeWork.plaka)+' · '+esc(activeWork.isEmriNo)+'</p>'+document.getElementById("preview").innerHTML+'<script>window.onload=function(){window.print()}<\/script></body></html>');w.document.close()}
function recordApproval(kind){if(!activeWork){alert("İş emri seçiniz.");return}if(!activeQuote){saveQuote();quotes=load(QUOTE_KEY);activeQuote=quotes.find(x=>String(x.isEmriId)===String(activeWork.id))}let status=document.getElementById("approvalStatus").value;if(kind==="reject")status="Reddedildi";const method=document.getElementById("method").value,by=document.getElementById("approvedBy").value.trim(),at=document.getElementById("approvedAt").value||localDateTimeValue(),note=document.getElementById("approvalNote").value.trim();activeQuote.approvalStatus=status;activeQuote.durum=status;activeQuote.approvedBy=by;activeQuote.approvalMethod=method;activeQuote.approvedAt=at;activeQuote.approvalNote=note;activeQuote.history=activeQuote.history||[];activeQuote.history.unshift({status,method,by,at,note,recordedAt:new Date().toISOString()});activeQuote.updatedAt=new Date().toISOString();put(QUOTE_KEY,quotes);works=load(WORK_KEY);const i=works.findIndex(w=>String(w.id)===String(activeWork.id));if(i>=0){works[i].onayDurumu=status;works[i].onayYontemi=method;works[i].onaylayan=by;works[i].onayTarihi=at;works[i].onayNotu=note;works[i].teklifNo=activeQuote.teklifNo;if(status==="Onaylandı")works[i].durum="Onaylandı · İşleme Hazır";else if(status==="Kısmi Onay")works[i].durum="Kısmi Onay";else if(status==="Reddedildi")works[i].durum="Reddedildi";works[i].updatedAt=new Date().toISOString();put(WORK_KEY,works);activeWork=works[i]}renderList();alert("Müşteri onay kaydı işlendi: "+status)}
function renderList(){quotes=load(QUOTE_KEY);const el=document.getElementById("list");if(!quotes.length){el.innerHTML='<div class="meta">Henüz teklif yok.</div>';return}el.innerHTML=quotes.map(q=>'<div class="item"><div class="itemTitle">'+esc(q.teklifNo)+' · '+esc(q.plaka)+' <span class="badge">'+esc(q.approvalStatus||q.durum||"Onay Bekliyor")+'</span></div><div class="meta">'+esc(q.cariAdi||"-")+' · '+esc(q.isEmriNo||"-")+' · '+money(q.genelToplam||0)+'<br>Onay: '+esc(q.approvalMethod||"-")+' · '+esc(q.approvedBy||"-")+' · '+esc(q.approvedAt||"-")+'</div><div class="btnrow"><button class="btn print" onclick="openQuote(&quot;'+q.id+'&quot;)">Aç</button></div></div>').join("")}
function openQuote(id){const q=quotes.find(x=>String(x.id)===String(id));if(!q)return;document.getElementById("workId").value=String(q.isEmriId);selectWork();window.scrollTo({top:0,behavior:"smooth"})}
function goOperations(){if(!activeWork){alert("İş emri seçiniz.");return}location.href="Islemler.html?isEmriId="+encodeURIComponent(activeWork.id)}
function preload(){const p=new URLSearchParams(location.search),id=p.get("isEmriId");if(!id)return;works=load(WORK_KEY);const target=works.find(w=>String(w.id)===String(id));if(target&&blockClosed(target))return;document.getElementById("workId").value=id;selectWork()}
fillWorks();renderList();document.getElementById("approvedAt").value=localDateTimeValue();preload();
</script></body></html>
