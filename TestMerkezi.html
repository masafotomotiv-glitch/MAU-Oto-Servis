<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAU · Test Merkezi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef3f8;color:#18324d}button,input,textarea,select{font:inherit}header{background:linear-gradient(90deg,#0d3e70,#0b61a8);color:#fff;padding:15px}.head{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px}.back{border:0;background:#ffffff1b;color:#fff;width:40px;height:40px;border-radius:9px;font-size:24px}.wrap{max-width:980px;margin:14px auto;padding:0 12px}.card{background:#fff;border:1px solid #dfe6ee;border-radius:12px;margin-bottom:12px;overflow:hidden}.head2{padding:13px 15px;border-bottom:1px solid #edf1f5;font-weight:900}.body{padding:14px}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{border:1px solid #e1e8ef;border-radius:9px;padding:10px;background:#f9fbfd}.box span{display:block;font-size:10px;color:#6f8094}.box b{font-size:17px}.check{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid #edf1f5;padding:10px 2px;font-size:11px}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e0e9;border-radius:8px;padding:10px}.field textarea{min-height:75px}.btn{border:0;border-radius:9px;padding:11px;font-weight:900;cursor:pointer}.blue{background:#0b76c5;color:#fff}.green{background:#11834f;color:#fff}.gray{background:#eef2f6;color:#405168}.row{border:1px solid #e1e8ef;border-radius:9px;padding:9px;margin-top:7px;font-size:10px}.row b{font-size:11px}.muted{color:#6f8094}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media(max-width:650px){.stats,.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style><script src="lisans.js"></script></head><body>
<header><div class="head"><button class="back" onclick="location.href='Ayarlar.html'">‹</button><div><div style="font-size:21px;font-weight:900">MAU Oto Servis · Test Merkezi</div><div style="font-size:11px;opacity:.9">20 günlük saha kullanımı · Hata ve eksik takibi</div></div></div></header>
<div class="wrap">
 <div class="card"><div class="head2">Test Dönemi</div><div class="body">
  <div class="stats"><div class="box"><span>Başlangıç</span><b id="start">-</b></div><div class="box"><span>Test Günü</span><b id="day">0 / 20</b></div><div class="box"><span>Açık Hata / Eksik</span><b id="open">0</b></div></div>
  <div class="actions"><button class="btn green" onclick="startTest()">20 Günlük Testi Başlat</button><button class="btn gray" onclick="location.href='LisansYonetim.html'">Lisans Test Yönetimi</button></div>
 </div></div>
 <div class="card"><div class="head2">Ana Akış Kontrolü</div><div class="body" id="checks"></div></div>
 <div class="card"><div class="head2">Hata / Eksik Kaydı</div><div class="body">
  <div class="grid"><div class="field"><label>Bölüm</label><select id="module"><option>Araç Kabul</option><option>İş Emirleri</option><option>İşlemler / Teklif</option><option>Atölye / Kalite</option><option>Fatura / Tahsilat</option><option>Cari / Kasa</option><option>Hasar / Sigorta</option><option>Eksper Arşivi</option><option>Raporlar</option><option>Lisans / Demo</option><option>Diğer</option></select></div><div class="field"><label>Önem</label><select id="level"><option>Kritik</option><option>Orta</option><option>Düşük</option></select></div><div class="field"><label>Başlık</label><input id="title" placeholder="Kısa sorun başlığı"></div></div>
  <div class="field" style="margin-top:8px"><label>Açıklama</label><textarea id="desc" placeholder="Ne yaptınız, ne oldu, ne olması gerekiyordu?"></textarea></div>
  <button class="btn blue" style="width:100%;margin-top:8px" onclick="addIssue()">Kaydet</button>
  <div id="issues"></div>
 </div></div>
</div>
<script>
const K="mau_qa_test",I="mau_qa_issues",C="mau_qa_checks";
const flows=["Araç kabul → iş emri oluşturma","İşçilik + parça + stok düşümü","Teklif → müşteri onayı","Atölye → kalite kontrol → teslim","Fatura → kısmi tahsilat → cari bakiye","Cari & Kasa → iptal/geri alma","Hasar → ekspertiz → sigorta onayı","Eksper Arşivi → fotoğraf/PDF → ZIP","Raporlar → PDF/CSV kontrolleri","15 gün demo → süre dolması → salt okunur → yeniden açılma","Yedek al → geri yükle → veri kontrolü"];
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function startTest(){let t=load(K,{});if(!t.startedAt)t.startedAt=new Date().toISOString();t.days=20;save(K,t);render()}
function toggle(i){const c=load(C,{});c[i]=!c[i];save(C,c);render()}
function addIssue(){const title=document.getElementById("title").value.trim();if(!title){alert("Başlık giriniz.");return}const a=load(I,[]);a.push({id:Date.now(),date:new Date().toISOString(),module:document.getElementById("module").value,level:document.getElementById("level").value,title,desc:document.getElementById("desc").value.trim(),closed:false});save(I,a);document.getElementById("title").value="";document.getElementById("desc").value="";render()}
function closeIssue(id){const a=load(I,[]),x=a.find(v=>v.id===id);if(x){x.closed=!x.closed;save(I,a);render()}}
function render(){const t=load(K,{}),a=load(I,[]),c=load(C,{});document.getElementById("start").textContent=t.startedAt?new Date(t.startedAt).toLocaleDateString("tr-TR"):"Başlatılmadı";const d=t.startedAt?Math.max(1,Math.min(20,Math.floor((Date.now()-Date.parse(t.startedAt))/86400000)+1)):0;document.getElementById("day").textContent=d+" / 20";document.getElementById("open").textContent=a.filter(x=>!x.closed).length;document.getElementById("checks").innerHTML=flows.map((x,i)=>'<label class="check"><input type="checkbox" '+(c[i]?"checked":"")+' onchange="toggle('+i+')"><span>'+x+'</span></label>').join("");document.getElementById("issues").innerHTML=a.slice().reverse().map(x=>'<div class="row" style="'+(x.closed?"opacity:.55":"")+'"><b>'+x.level+' · '+x.module+' · '+x.title+'</b><div class="muted">'+new Date(x.date).toLocaleString("tr-TR")+'</div><div style="margin:5px 0">'+(x.desc||"-")+'</div><button class="btn gray" onclick="closeIssue('+x.id+')">'+(x.closed?"Yeniden Aç":"Çözüldü")+'</button></div>').join("")}render();
</script></body></html>
