<!DOCTYPE html>
<html lang="tr"><head>
<script src="auth.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAU Oto Servis - Parça & Stok</title>
<style>
*{box-sizing:border-box}:root{--b:#0874d1;--b2:#083fa7;--g:#0a944a;--bg:#f3f6fb;--line:#d9e1ea;--muted:#64748b;--red:#b42335}
body{margin:0;font-family:Arial;background:var(--bg);color:#1f2937}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:16px}.head{max-width:1160px;margin:auto;display:flex;gap:12px;align-items:center}.back{border:0;background:#ffffff1c;color:#fff;width:42px;height:42px;border-radius:10px;font-size:22px}.title{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.86;margin-top:3px}
.wrap{max-width:1160px;margin:auto;padding:16px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800}.new{background:var(--g);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;padding:12px;border-radius:12px;text-align:center}.stat b{display:block;font-size:22px;color:#0864b8}.stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #0000000b}.name{font-size:18px;font-weight:900}.meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}.badge{display:inline-block;background:#eaf3ff;color:#075ba8;border-radius:10px;padding:4px 8px;font-size:10px;font-weight:800;margin-right:4px}.critical{background:#ffe8eb;color:#a21c2b}.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.actions button{border:0;border-radius:8px;padding:8px 10px;font-weight:800}.edit{background:#eaf2ff;color:#0756a5}.in{background:#e8f7ef;color:#087840}.out{background:#fff2df;color:#9b6200}.del{background:#ffe8eb;color:#a21c2b}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;overflow:auto;padding:15px}.box{max-width:820px;background:#fff;margin:20px auto;border-radius:15px;overflow:hidden}.boxHead{background:var(--b);color:#fff;padding:15px 17px;font-weight:900;display:flex;justify-content:space-between}.boxBody{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:9px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:#4b5968}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px}textarea{min-height:75px}.save{width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:14px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}}
</style><script src="lisans.js"></script>
</head><body>
<header><div class="head"><button class="back" onclick="location.href='index.html'">‹</button><div><div class="title">M•• MAU OTO SERVİS</div><div class="sub">Parça & Stok · OEM · Tedarikçi · Kritik Stok · Alış/Satış Fiyatı</div></div></div></header>
<div class="wrap">
 <div class="toolbar"><input id="search" class="search" placeholder="Parça adı, kodu, OEM, marka, barkod ara..." oninput="render()"><button class="btn" style="background:#eaf2ff;color:#0756a5" onclick="laborCleanup()">İşçilikleri Stoktan Ayır</button><button class="btn" style="background:#fff4dd;color:#8a5700" onclick="mergeDuplicateStock()">Mükerrerleri Birleştir</button><button class="btn new" onclick="openForm()">+ Yeni Parça</button></div>
 <div class="stats"><div class="stat"><b id="total">0</b><span>Toplam Kalem</span></div><div class="stat"><b id="qty">0</b><span>Toplam Miktar</span></div><div class="stat"><b id="critical">0</b><span>Kritik Stok</span></div><div class="stat"><b id="value">0 ₺</b><span>Stok Alış Değeri</span></div></div>
 <div id="list"></div>
</div>
<div id="modal" class="modal"><div class="box"><div class="boxHead"><span id="formTitle">Yeni Parça</span><span onclick="closeForm()" style="cursor:pointer">×</span></div><div class="boxBody">
 <div class="grid">
  <div class="field"><label>Parça Kodu</label><input id="code" readonly></div>
  <div class="field"><label>OEM / Üretici No</label><input id="oem"></div>
  <div class="field full"><label>Parça / Malzeme Adı *</label><input id="name"></div>
  <div class="field"><label>Marka</label><input id="brand"></div><div class="field"><label>Barkod</label><input id="barcode"></div>
  <div class="field"><label>Birim</label><select id="unit"><option>Adet</option><option>Litre</option><option>Kg</option><option>Metre</option><option>Set</option></select></div>
  <div class="field"><label>Raf / Konum</label><input id="location"></div>
  <div class="field"><label>Mevcut Stok</label><input id="stock" type="number" min="0" step="0.01"></div>
  <div class="field"><label>Minimum Stok</label><input id="minStock" type="number" min="0" step="0.01"></div>
  <div class="field"><label>Alış Fiyatı (TL)</label><input id="buyPrice" type="number" min="0" step="0.01"></div>
  <div class="field"><label>Satış Fiyatı (TL)</label><input id="salePrice" type="number" min="0" step="0.01"></div>
  <div class="field"><label>KDV (%)</label><input id="vat" type="number" min="0" value="20"></div>
  <div class="field"><label>Tedarikçi Cari</label><select id="supplierId"><option value="">Seçiniz</option></select></div>
  <div class="field"><label>Durum</label><select id="status"><option>Aktif</option><option>Pasif</option></select></div>
  <div class="field full"><label>Not</label><textarea id="note"></textarea></div>
 </div>
 <button class="save" onclick="save()">✓ Parçayı Kaydet</button>
</div></div></div>
<script>
const KEY="mau_stok_parcalar",CARI_KEY="mau_cariler",MOVE_KEY="mau_stok_hareketleri";
function load(k){try{const v=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}function put(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function money(n){return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺"}
const LABOR_ARCHIVE_KEY="mau_stok_iscilik_arsiv";
const LABOR_NAMES=["ERA FULL BAKIM","ŞARJ DİNAMOSU BAKIM","WEBOSTA DEMONTE","BASAMAK YAPIMI","BASKI BALATA DEĞİŞİM İŞÇİLİK","BOBİNAJ İŞLEMLERİ","BOYA İŞÇİLİĞİ","CAM SÖK TAK İŞÇİLİK","DÖŞEME İŞÇİLİK","ELEKTRİK İŞÇİLİĞİ","FREN BALATA DEĞİŞİMİ İŞÇİLİK","İŞÇİLİK","KAPI İŞÇİLİK","KAPORTA İŞÇİLİĞİ","KARASÖR TAMİRİ","KİLİT İŞÇİLİK","KOLTUK DÜZENLEME","MAKAS DEĞİSİM İŞÇİLİĞİ","MAKAS İŞÇİLİĞİ","MEKANİK İŞÇİLİĞİ","MOTOR İŞÇİLİK SPRİNTER","MOTOR REKTEFİYE","ŞANZIMAN İŞÇİLİK","ŞASE DÜZELTME İŞÇİLİK","YAĞ BAKIM İŞÇİLİK"];
function lf(v){return String(v||"").toLocaleUpperCase("tr-TR").replace(/\s+/g," ").trim()}
function laborCleanup(){
 const stock=load(KEY),services=load("mau_iscilik_tanimlari"),serviceNames=new Set(services.map(x=>lf(x.name))),wanted=new Set(LABOR_NAMES.map(lf));
 const rows=stock.filter(x=>wanted.has(lf(x.name))&&serviceNames.has(lf(x.name)));
 if(!rows.length){alert("Stokta ayrılacak işçilik kalmadı.");return}
 if(!confirm(rows.length+" işçilik/hizmet kartı stok listesinden ayrılacak. İşçilikler bölümündeki kayıtlar korunacak. Devam edilsin mi?"))return;
 const ids=new Set(rows.map(x=>String(x.id))),archive=load(LABOR_ARCHIVE_KEY),have=new Set(archive.map(x=>String(x.id)));
 rows.forEach(x=>{if(!have.has(String(x.id)))archive.unshift(x)});
 put(LABOR_ARCHIVE_KEY,archive);put(KEY,stock.filter(x=>!ids.has(String(x.id))));
 items=load(KEY);render();alert(rows.length+" işçilik stoktan ayrıldı.");
}
function mergeDuplicateStock(){
 const stock=load(KEY),groups=new Map();
 stock.forEach(x=>{
  const code=lf(x.code||x.barcode),name=lf(x.name);
  if(!code||!name)return;
  const k=code+"||"+name;
  if(!groups.has(k))groups.set(k,[]);
  groups.get(k).push(x);
 });
 const dupGroups=[...groups.values()].filter(g=>g.length>1);
 const dupCount=dupGroups.reduce((a,g)=>a+g.length-1,0);
 if(!dupCount){alert("Mükerrer stok kartı bulunmadı.");return}
 if(!confirm(dupGroups.length+" üründe "+dupCount+" mükerrer kart tek karta birleştirilecek. Miktarlar toplanacak, eski kartlar arşivlenecek. Devam edilsin mi?"))return;
 let archive=load("mau_stok_mukerrer_arsiv"),archiveIds=new Set(archive.map(x=>String(x.id))),removeIds=new Set();
 dupGroups.forEach(g=>{
  const keep=g[0];
  let qty=0,min=0;
  g.forEach(x=>{qty+=Number(x.stock||0);min=Math.max(min,Number(x.minStock||0))});
  keep.stock=qty;keep.minStock=min;keep.updatedAt=new Date().toISOString();
  keep.note=(keep.note?keep.note+" · ":"")+"Mükerrer stok kartları birleştirildi ("+g.length+" kaynak kayıt).";
  g.slice(1).forEach(x=>{
   removeIds.add(String(x.id));
   if(!archiveIds.has(String(x.id)))archive.unshift({...x,archivedAt:new Date().toISOString(),archiveReason:"Mükerrer stok kartı birleştirme"});
  });
 });
 put("mau_stok_mukerrer_arsiv",archive);
 put(KEY,stock.filter(x=>!removeIds.has(String(x.id))));
 items=load(KEY);render();
 alert(dupGroups.length+" ürün grubu birleştirildi; "+dupCount+" mükerrer kart stok listesinden kaldırıldı.");
}

let items=load(KEY),editId=null;
function nextCode(){let m=0;items.forEach(x=>{const n=parseInt(String(x.code||"").replace(/\D/g,""),10);if(Number.isFinite(n)&&n>m)m=n});return "PRC-"+String(m+1).padStart(5,"0")}
function fillSuppliers(){const cs=load(CARI_KEY).filter(c=>(c.roles||[]).includes("Tedarikçi")&&c.active!==false);document.getElementById("supplierId").innerHTML='<option value="">Seçiniz</option>'+cs.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.code||"")+' - '+esc(c.name||"")+'</option>').join("")}
function openForm(id){fillSuppliers();editId=id==null?null:id;const x=editId==null?null:items.find(a=>String(a.id)===String(editId));document.getElementById("formTitle").innerText=x?"Parça Düzenle":"Yeni Parça";["oem","name","brand","barcode","location","stock","minStock","buyPrice","salePrice","note"].forEach(k=>document.getElementById(k).value=x?(x[k]??""):"");document.getElementById("code").value=x?(x.code||""):nextCode();document.getElementById("unit").value=x?(x.unit||"Adet"):"Adet";document.getElementById("vat").value=x?(x.vat??20):20;document.getElementById("supplierId").value=x?(x.supplierId||""):"";document.getElementById("status").value=x?(x.status||"Aktif"):"Aktif";document.getElementById("modal").style.display="block"}
function closeForm(){document.getElementById("modal").style.display="none"}
function save(){const name=document.getElementById("name").value.trim();if(!name){alert("Parça / malzeme adı giriniz.");return}const old=editId==null?null:items.find(a=>String(a.id)===String(editId));const sid=document.getElementById("supplierId").value,c=load(CARI_KEY).find(x=>String(x.id)===String(sid));const x={id:old?old.id:Date.now(),code:old?old.code:nextCode(),oem:document.getElementById("oem").value.trim(),name,brand:document.getElementById("brand").value.trim(),barcode:document.getElementById("barcode").value.trim(),unit:document.getElementById("unit").value,location:document.getElementById("location").value.trim(),stock:Number(document.getElementById("stock").value||0),minStock:Number(document.getElementById("minStock").value||0),buyPrice:Number(document.getElementById("buyPrice").value||0),salePrice:Number(document.getElementById("salePrice").value||0),vat:Number(document.getElementById("vat").value||0),supplierId:sid,supplierName:c?c.name:"",status:document.getElementById("status").value,active:document.getElementById("status").value==="Aktif",note:document.getElementById("note").value.trim(),createdAt:old&&old.createdAt?old.createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(old)items[items.findIndex(a=>String(a.id)===String(old.id))]=x;else items.unshift(x);put(KEY,items);closeForm();render()}
function move(id,dir){
 const x=items.find(a=>String(a.id)===String(id));if(!x)return;
 const raw=prompt((dir>0?"Stok giriş":"Stok çıkış")+" miktarı:","1");if(raw==null)return;
 const q=Number(String(raw).replace(",","."));if(!Number.isFinite(q)||q<=0){alert("Geçerli miktar giriniz.");return}if(dir<0&&q>x.stock){alert("Stok yetersiz.");return}
 let belgeDurumu="",belgeNo="";
 if(dir>0){
  const choice=prompt("Bu stok girişinin belge durumu:\n1 = Belge Bekliyor\n2 = Fatura / Fiş Var\n3 = İrsaliye ile Geldi","1");
  if(choice==null)return;
  if(String(choice).trim()==="2"){belgeDurumu="Belgeli";belgeNo=prompt("Fatura / fiş no (varsa):","")||""}
  else if(String(choice).trim()==="3"){belgeDurumu="İrsaliye ile Geldi";belgeNo=prompt("İrsaliye no (varsa):","")||""}
  else belgeDurumu="Belge Bekliyor";
 }
 x.stock=Number(x.stock||0)+(dir*q);x.updatedAt=new Date().toISOString();put(KEY,items);
 const moves=load(MOVE_KEY);moves.unshift({id:Date.now(),partId:x.id,partCode:x.code,partName:x.name,type:dir>0?"Giriş":"Çıkış",qty:q,date:new Date().toISOString(),source:"Manuel",supplierId:x.supplierId||"",supplierName:x.supplierName||"",belgeDurumu,belgeNo});
 put(MOVE_KEY,moves);render();
 if(dir>0&&belgeDurumu==="Belge Bekliyor")alert("Stok girişi kaydedildi. Tedarikçi belgesi geldiğinde Faturalar > Gelen Fatura Tara bölümünden eşleştirebilirsiniz.");
}
function del(id){const x=items.find(a=>String(a.id)===String(id));if(!x)return;if(confirm(x.name+" silinsin mi?")){items=items.filter(a=>String(a.id)!==String(id));put(KEY,items);render()}}
function render(){items=load(KEY);const q=document.getElementById("search").value.toLocaleLowerCase("tr-TR").trim();const list=items.filter(x=>!q||[x.code,x.oem,x.name,x.brand,x.barcode,x.location,x.supplierName].join(" ").toLocaleLowerCase("tr-TR").includes(q));document.getElementById("total").innerText=items.length;document.getElementById("qty").innerText=items.reduce((a,x)=>a+Number(x.stock||0),0).toLocaleString("tr-TR");document.getElementById("critical").innerText=items.filter(x=>Number(x.stock||0)<=Number(x.minStock||0)).length;document.getElementById("value").innerText=money(items.reduce((a,x)=>a+Number(x.stock||0)*Number(x.buyPrice||0),0));const el=document.getElementById("list");if(!list.length){el.innerHTML='<div class="card empty">Parça / stok kaydı yok.</div>';return}el.innerHTML=list.map(x=>{const crit=Number(x.stock||0)<=Number(x.minStock||0);return '<div class="card"><div class="name">'+esc(x.name)+' <span class="badge">'+esc(x.code)+'</span>'+(crit?'<span class="badge critical">KRİTİK</span>':'')+'</div><div class="meta">OEM: '+esc(x.oem||"-")+' · '+esc(x.brand||"-")+' · Stok: <b>'+Number(x.stock||0).toLocaleString("tr-TR")+' '+esc(x.unit||"")+'</b> · Min: '+Number(x.minStock||0).toLocaleString("tr-TR")+'<br>Alış '+money(x.buyPrice)+' · Satış '+money(x.salePrice)+' · Raf '+esc(x.location||"-")+' · Tedarikçi '+esc(x.supplierName||"-")+'</div><div class="actions"><button class="edit" onclick="openForm(&quot;'+x.id+'&quot;)">Düzenle</button><button class="in" onclick="move(&quot;'+x.id+'&quot;,1)">+ Stok Giriş</button><button class="out" onclick="move(&quot;'+x.id+'&quot;,-1)">− Stok Çıkış</button><button class="del" onclick="del(&quot;'+x.id+'&quot;)">Sil</button></div></div>'}).join("")}
window.addEventListener("click",e=>{if(e.target===document.getElementById("modal"))closeForm()});render();
</script></body></html>
