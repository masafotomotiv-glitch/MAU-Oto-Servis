<!DOCTYPE html>
<html lang="tr">
<head>
<script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAU Oto Servis · Çıkış</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#073a70,#0b6db8 55%,#0a8a87);display:flex;align-items:center;justify-content:center;padding:18px;color:#18324d}
.card{width:min(420px,100%);background:#fff;border-radius:16px;box-shadow:0 18px 55px #001a3340;overflow:hidden;text-align:center}
.top{padding:24px 22px 18px;background:linear-gradient(90deg,#073a70,#005298);border-bottom:1px solid #0b477a;color:#fff}.brand-logo{width:min(270px,82%);height:auto;max-height:86px;object-fit:contain;display:block;margin:0 auto}.brand-fallback{display:none;font-size:22px;font-weight:900;letter-spacing:.5px}.sub{font-size:11px;color:#dbeafe;margin-top:7px}
.body{padding:22px}.ok{font-size:50px;margin-bottom:8px}.text{font-size:13px;line-height:1.6;margin-bottom:18px}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#0b76c5;color:#fff;font-weight:900;cursor:pointer}
.note{font-size:10px;color:#718096;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<div class="card">
 <div class="top"><img class="brand-logo" src="mau-logo-oto-servis.svg" alt="MAU Oto Servis" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="brand-fallback">MAU OTO SERVİS</div><div class="sub">Oturum Sonlandırıldı</div></div>
 <div class="body"><div class="ok">✓</div><div class="text"><b>Çıkış yapıldı.</b><br>Servis kayıtları ve cihazdaki veriler silinmedi.</div><button class="btn" onclick="location.replace('Giris.html?v='+Date.now())">Tekrar Giriş / Ana Ekran</button><div class="note">Oturum anahtarı bu cihazdan temizlendi. Tekrar erişim için kullanıcı adı ve şifre gerekir.</div></div>
</div>
<script>
try{MAUAuth.logout()}catch(e){}
location.replace('Giris.html?v='+Date.now());
</script>
</body>
</html>
