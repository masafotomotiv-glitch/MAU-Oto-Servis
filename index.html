<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAU Oto Servis</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#e9eef4;
  color:#10233e;
}
.app{
  width:100%;
  max-width:1200px;
  min-height:100vh;
  margin:auto;
  background:#f7f9fc;
  padding-bottom:18px;
}

/* ÜST BAŞLIK */
.header{
  height:112px;
  margin:0 18px;
  padding:0 24px;
  background:linear-gradient(90deg,#073a70,#005298);
  border-radius:0 0 15px 15px;
  color:white;
  display:grid;
  grid-template-columns:220px 1fr 310px;
  align-items:center;
  gap:20px;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
}
.logo-mark{
  width:55px;
  height:55px;
  color:#12d5f4;
}
.logo-main{
  font-size:32px;
  font-weight:900;
  line-height:1;
}
.logo-sub{
  font-size:13px;
  font-weight:800;
  color:#17d9f4;
  margin-top:6px;
}
.company-label{
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
}
.company-box{
  height:43px;
  max-width:320px;
  padding:0 14px;
  background:white;
  color:#172943;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-weight:bold;
  font-size:14px;
}
.top-menu{
  height:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
}
.top-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:12px;
  font-weight:bold;
}
.top-item svg{
  width:29px;
  height:29px;
  fill:white;
}
