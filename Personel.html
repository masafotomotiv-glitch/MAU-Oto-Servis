<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAU Oto Servis - Personel / Ustalar</title>
<style>
*{box-sizing:border-box}:root{--b:#0874d1;--b2:#083fa7;--g:#0a944a;--bg:#f3f6fb;--line:#d9e1ea;--muted:#64748b}
body{margin:0;font-family:Arial;background:var(--bg);color:#1f2937}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:16px}.head{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center}.back{border:0;background:#ffffff1c;color:#fff;width:42px;height:42px;border-radius:10px;font-size:22px}.title{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.86;margin-top:3px}
.wrap{max-width:1100px;margin:auto;padding:16px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800}.new{background:var(--g);color:#fff}.secondary{background:#eaf2ff;color:#0756a5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;padding:12px;border-radius:12px;text-align:center}.stat b{display:block;font-size:22px;color:#0864b8}.stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #0000000b}.name{font-size:18px;font-weight:900}.meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}.badge{display:inline-block;background:#eaf3ff;color:#075ba8;border-radius:10px;padding:4px 8px;font-size:10px;font-weight:800;margin-right:4px}.actions{display:flex;gap:6px;margin-top:10px}.actions button{border:0;border-radius:8px;padding:8px 10px;font-weight:800}.edit{background:#eaf2ff;color:#0756a5}.pass{background:#fff2df;color:#9b6200}.del{background:#ffe8eb;color:#a21c2b}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;overflow:auto;padding:15px}.box{max-width:760px;background:#fff;margin:20px auto;border-radius:15px;overflow:hidden}.boxHead{background:var(--b);color:#fff;padding:15px 17px;font-weight:900;display:flex;justify-content:space-between}.boxBody{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:9px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:#4b5968}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px}textarea{min-height:75px}.save{width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:14px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}}
</style><script src="lisans.js"></script>
</head><body>
<header><div class="head"><button class="back" onclick="location.href='index.html'">‹</button><div><div class="title">M•• MAU OTO SERVİS</div><div class="sub">Personel / Ustalar · Rol · Bölüm · Aktiflik</div></div></div></header>
<div class="wrap">
 <div class="toolbar"><input id="search" class="search" placeholder="Ad, personel kodu, bölüm, rol ara..." oninput="render()"><button class="btn secondary" onclick="location.href='Hizmetler.html?v='+Date.now()">İşçilik Tanımları</button><button class="btn new" onclick="openForm()">+ Yeni Personel</button></div>
 <div class="stats"><div class="stat"><b id="total">0</b><span>Toplam</span></div><div class="stat"><b id="active">0</b><span>Aktif</span></div><div class="stat"><b id="advisors">0</b><span>Servis Danışmanı</span></div><div class="stat"><b id="techs">0</b><span>Usta / Teknisyen</span></div></div>
 <div id="list"></div>
</div>
<div id="modal" class="modal"><div class="box"><div class="boxHead"><span id="formTitle">Yeni Personel</span><span onclick="closeForm()" style="cursor:pointer">×</span></div><div class="boxBody">
 <div class="grid">
  <div class="field"><label>Personel Kodu</label><input id="code" readonly></div>
  <div class="field"><label>Ad Soyad *</label><input id="name"></div>
  <div class="field"><label>Rol *</label><select id="role"><option>Servis Danışmanı</option><option>Usta</option><option>Teknisyen</option><option>Usta Başı</option><option>Araç Kabul</option><option>Yönetici</option><option>Depo / Parça</option><option>Diğer</option></select></div>
  <div class="field"><label>Bölüm</label><select id="department"><option>Genel</option><option>Mekanik</option><option>Elektrik</option><option>Kaporta</option><option>Boya</option><option>Lastik</option><option>Periyodik Bakım</option><option>Parça / Stok</option><option>Araç Kabul</option></select></div>
  <div class="field"><label>Telefon</label><input id="phone"></div><div class="field"><label>E-posta</label><input id="email"></div>
  <div class="field"><label>Saatlik İç Maliyet (TL)</label><input id="hourlyCost" type="number" min="0" step="0.01"></div>
  <div class="field"><label>Durum</label><select id="status"><option>Aktif</option><option>Pasif</option></select></div>
  <div class="field full"><label>Yetki / Not</label><textarea id="note" placeholder="Örn: sadece mekanik iş emri, teklif görüntüleyebilir..."></textarea></div>
 </div>
 <button class="save" onclick="save()">✓ Personeli Kaydet</button>
</div></div></div>
<script>
const KEY="mau_personel";function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}function put(){localStorage.setItem(KEY,JSON.stringify(items))}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
let items=load(),editId=null;function nextCode(){let m=0;items.forEach(x=>{const n=parseInt(String(x.code||"").replace(/\D/g,""),10);if(Number.isFinite(n)&&n>m)m=n});return "PR-"+String(m+1).padStart(5,"0")}
function openForm(id){editId=id==null?null:id;const x=editId==null?null:items.find(a=>String(a.id)===String(editId));document.getElementById("formTitle").innerText=x?"Personel Düzenle":"Yeni Personel";["name","phone","email","hourlyCost","note"].forEach(k=>document.getElementById(k).value=x?(x[k]||""):"");document.getElementById("code").value=x?(x.code||""):nextCode();document.getElementById("role").value=x?(x.role||"Usta"):"Servis Danışmanı";document.getElementById("department").value=x?(x.department||"Genel"):"Genel";document.getElementById("status").value=x?(x.status||"Aktif"):"Aktif";document.getElementById("modal").style.display="block"}
function closeForm(){document.getElementById("modal").style.display="none"}
function save(){const name=document.getElementById("name").value.trim();if(!name){alert("Ad Soyad giriniz.");return}const old=editId==null?null:items.find(a=>String(a.id)===String(editId));const x={id:old?old.id:Date.now(),code:old?old.code:nextCode(),name,role:document.getElementById("role").value,department:document.getElementById("department").value,phone:document.getElementById("phone").value.trim(),email:document.getElementById("email").value.trim(),hourlyCost:Number(document.getElementById("hourlyCost").value||0),note:document.getElementById("note").value.trim(),status:document.getElementById("status").value,active:document.getElementById("status").value==="Aktif",createdAt:old&&old.createdAt?old.createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(old)items[items.findIndex(a=>String(a.id)===String(old.id))]=x;else items.unshift(x);put();closeForm();render()}
function toggle(id){const x=items.find(a=>String(a.id)===String(id));if(!x)return;x.active=!x.active;x.status=x.active?"Aktif":"Pasif";x.updatedAt=new Date().toISOString();put();render()}
function del(id){const x=items.find(a=>String(a.id)===String(id));if(!x)return;if(confirm(x.name+" personel kaydı silinsin mi?")){items=items.filter(a=>String(a.id)!==String(id));put();render()}}
function render(){items=load();const q=document.getElementById("search").value.toLocaleLowerCase("tr-TR").trim();const list=items.filter(x=>!q||[x.code,x.name,x.role,x.department,x.phone].join(" ").toLocaleLowerCase("tr-TR").includes(q));document.getElementById("total").innerText=items.length;document.getElementById("active").innerText=items.filter(x=>x.active!==false&&x.status!=="Pasif").length;document.getElementById("advisors").innerText=items.filter(x=>x.active!==false&&["Servis Danışmanı","Araç Kabul","Yönetici"].includes(x.role)).length;document.getElementById("techs").innerText=items.filter(x=>x.active!==false&&["Usta","Teknisyen","Usta Başı"].includes(x.role)).length;const el=document.getElementById("list");if(!list.length){el.innerHTML='<div class="card empty">Personel kaydı yok.</div>';return}el.innerHTML=list.map(x=>'<div class="card" style="'+(x.active===false?'opacity:.55':'')+'"><div class="name">'+esc(x.name)+' <span class="badge">'+esc(x.code)+'</span></div><div class="meta">'+esc(x.role)+' · '+esc(x.department)+'<br>'+esc(x.phone||"-")+(x.hourlyCost?(' · İç maliyet: '+Number(x.hourlyCost).toLocaleString("tr-TR")+' TL/saat'):'')+'</div><div class="actions"><button class="edit" onclick="openForm(&quot;'+x.id+'&quot;)">Düzenle</button><button class="pass" onclick="toggle(&quot;'+x.id+'&quot;)">'+(x.active===false?'Aktif Et':'Pasife Al')+'</button><button class="del" onclick="del(&quot;'+x.id+'&quot;)">Sil</button></div></div>').join("")}
window.addEventListener("click",e=>{if(e.target===document.getElementById("modal"))closeForm()});render();
</script></body></html>
