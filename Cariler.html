<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAU Oto Servis - Cariler</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f6fb;
 color:#1f2937
}
header{
 background:linear-gradient(135deg,#0874d1,#083fa7);
 color:white;
 padding:18px
}
.head{
 max-width:1200px;
 margin:auto;
 display:flex;
 align-items:center;
 gap:12px
}
.back{
 background:#ffffff18;
 border:0;
 color:white;
 width:42px;
 height:42px;
 border-radius:10px;
 font-size:22px
}
.logo{font-size:23px;font-weight:800}
.sub{font-size:13px;opacity:.85;margin-top:3px}
.container{max-width:1200px;margin:auto;padding:18px}

.toolbar{
 display:flex;
 gap:10px;
 margin-bottom:12px
}
.search{
 flex:1;
 padding:14px;
 border:1px solid #d8e0ea;
 border-radius:12px;
 font-size:15px
}
.add{
 border:0;
 background:#08a451;
 color:white;
 font-weight:700;
 padding:0 20px;
 border-radius:12px
}

.tabs{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin:12px 0
}
.tab{
 border:0;
 background:white;
 padding:11px 16px;
 border-radius:22px;
 box-shadow:0 2px 8px #0000000c
}
.tab.on{background:#0874d1;color:white}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin:15px 0
}
.stat{
 background:white;
 border-radius:13px;
 padding:14px;
 text-align:center;
 box-shadow:0 2px 10px #0000000b
}
.stat b{
 display:block;
 font-size:24px;
 color:#0864b8
}
.stat span{font-size:13px;color:#64748b}

.card{
 background:white;
 border-radius:15px;
 padding:17px;
 margin-bottom:12px;
 box-shadow:0 3px 14px #0000000c
}
.name{font-size:19px;font-weight:800}
.code{font-size:12px;color:#7b8794;margin:5px 0}
.badges{margin:8px 0}
.badge{
 display:inline-block;
 background:#e9f3ff;
 color:#075ca8;
 padding:5px 9px;
 margin:2px;
 border-radius:10px;
 font-size:12px
}
.badge.type{background:#e8f7ef;color:#087840}
.info{font-size:13px;line-height:1.7;color:#536170}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr 1fr 1fr;
 gap:7px;
 margin-top:13px
}
.actions button{
 border:0;
 padding:11px 5px;
 border-radius:9px;
 font-weight:700
}
.open{background:#0874d1;color:white}
.edit{background:#eaf2ff;color:#0756a5}
.pass{background:#fff2df;color:#9b6200}
.del{background:#ffe8eb;color:#a21c2b}

.empty{
 background:white;
 text-align:center;
 padding:50px 15px;
 border-radius:15px;
 color:#64748b
}

/* CARİ FORMU */
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:1000;
 overflow:auto;
 padding:15px
}
.box{
 max-width:760px;
 background:white;
 margin:20px auto;
 border-radius:16px;
 overflow:hidden
}
.boxHead{
 background:#0874d1;
 color:white;
 padding:17px;
 font-size:19px;
 font-weight:800;
 display:flex;
 justify-content:space-between
}
.boxBody{padding:17px}

.typeRow{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin:10px 0
}
.typeBtn{
 border:1px solid #d8e0ea;
 background:white;
 padding:14px;
 border-radius:10px
}
.typeBtn.selected{
 border:2px solid #0874d1;
 background:#f1f7ff
}

.roleGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin:10px 0 18px
}
.role{
 border:1px solid #e0e6ed;
 padding:12px;
 border-radius:9px
}

.formGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.field{margin-bottom:11px}
.field.full{grid-column:1/-1}
label{
 display:block;
 font-size:12px;
 font-weight:700;
 margin-bottom:5px;
 color:#4c5968
}
input,textarea,select{
 width:100%;
 border:1px solid #d9e1ea;
 padding:12px;
 border-radius:9px;
 font-size:14px
}
textarea{min-height:75px}
.save{
 width:100%;
 background:#09a44f;
 color:white;
 border:0;
 padding:14px;
 border-radius:10px;
 font-size:16px;
 font-weight:800
}

/* CARİ DETAY */
.detail{
 display:none;
 position:fixed;
 inset:0;
 background:#f3f6fb;
 z-index:900;
 overflow:auto
}
.detailHead{
 background:linear-gradient(135deg,#0874d1,#083fa7);
 color:white;
 padding:16px
}
.detailTop{
 max-width:1200px;
 margin:auto;
 display:flex;
 align-items:center;
 gap:12px
}
.detailTitle{font-size:21px;font-weight:800}
.detailCode{font-size:12px;opacity:.85}

.summary{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin:15px 0
}
.sum{
 background:white;
 padding:14px;
 border-radius:13px;
 box-shadow:0 2px 10px #0000000c
}
.sum span{
 font-size:12px;
 color:#64748b
}
.sum b{
 display:block;
 font-size:20px;
 margin-top:5px
}
.green{color:#078744}
.red{color:#c12738}
.blue{color:#0864b8}

.detailTabs{
 display:flex;
 overflow:auto;
 gap:7px;
 margin:12px 0;
 padding-bottom:4px
}
.dtab{
 white-space:nowrap;
 border:0;
 background:white;
 padding:11px 14px;
 border-radius:9px
}
.dtab.on{
 background:#0874d1;
 color:white
}

.panel{
 background:white;
 border-radius:14px;
 padding:16px;
 min-height:260px;
 box-shadow:0 2px 12px #0000000b
}
.panelTitle{
 font-size:18px;
 font-weight:800;
 margin-bottom:13px
}

.quick{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:14px
}
.quick button{
 border:0;
 background:#eaf3ff;
 color:#075ba8;
 padding:10px 13px;
 border-radius:8px;
 font-weight:700
}
.quick .pdf{
 background:#ffe9ec;
 color:#a11e30
}

.tableWrap{overflow:auto}
table{
 width:100%;
 border-collapse:collapse;
 min-width:650px
}
th,td{
 text-align:left;
 border-bottom:1px solid #edf0f3;
 padding:11px 8px;
 font-size:13px
}
th{background:#f7f9fc}

.miniForm{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 background:#f7f9fc;
 padding:12px;
 border-radius:10px;
 margin-bottom:14px
}
.miniForm button{
 border:0;
 background:#0874d1;
 color:white;
 border-radius:8px;
 font-weight:700
}

.overviewGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}
.overCard{
 border:1px solid #e8edf2;
 border-radius:12px;
 padding:14px
}
.overCard h3{margin:0 0 10px;font-size:15px}

@media(max-width:700px){
 .stats,.summary{grid-template-columns:1fr 1fr}
 .actions{grid-template-columns:1fr 1fr}
 .formGrid,.roleGrid,.overviewGrid{grid-template-columns:1fr}
 .miniForm{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
 <div class="head">
  <button class="back" onclick="location.href='index.html'">‹</button>
  <div>
   <div class="logo">M•• MAU OTO SERVİS</div>
   <div class="sub">Cariler · Müşteri · Tedarikçi · Sigorta · Eksper</div>
  </div>
 </div>
</header>

<div class="container">

 <div class="toolbar">
  <input id="search" class="search"
   placeholder="Ad, firma, telefon, vergi no, cari kodu ara..."
   oninput="render()">

  <button class="add" onclick="openForm()">+ Yeni Cari</button>
 </div>

 <div class="tabs">
  <button class="tab on" onclick="setFilter('Tümü',this)">Tümü</button>
  <button class="tab" onclick="setFilter('Müşteri',this)">Müşteriler</button>
  <button class="tab" onclick="setFilter('Tedarikçi',this)">Tedarikçiler</button>
  <button class="tab" onclick="setFilter('Sigorta Şirketi',this)">Sigorta Şirketleri</button>
  <button class="tab" onclick="setFilter('Eksper Firması',this)">Eksper Firmaları</button>
 </div>

 <div class="stats">
  <div class="stat"><b id="m">0</b><span>Müşteri</span></div>
  <div class="stat"><b id="t">0</b><span>Tedarikçi</span></div>
  <div class="stat"><b id="s">0</b><span>Sigorta</span></div>
  <div class="stat"><b id="e">0</b><span>Eksper</span></div>
 </div>

 <div id="list"></div>
</div>

<!-- YENİ / DÜZENLE CARİ -->
<div id="modal" class="modal">
 <div class="box">

  <div class="boxHead">
   <span id="formTitle">Yeni Cari Kartı</span>
   <span onclick="closeForm()" style="cursor:pointer">×</span>
  </div>

  <div class="boxBody">

   <b>Cari Tipi</b>

   <div class="typeRow">
    <button id="b1" class="typeBtn selected"
     onclick="selectType('Bireysel')">👤 Bireysel</button>

    <button id="b2" class="typeBtn"
     onclick="selectType('Kurumsal')">🏢 Kurumsal</button>
   </div>

   <b>Cari Rolü</b>

   <div class="roleGrid">
    <label class="role">
     <input type="checkbox" class="roleC" value="Müşteri">
     Müşteri
    </label>

    <label class="role">
     <input type="checkbox" class="roleC" value="Tedarikçi">
     Tedarikçi
    </label>

    <label class="role">
     <input type="checkbox" class="roleC" value="Sigorta Şirketi">
     Sigorta Şirketi
    </label>

    <label class="role">
     <input type="checkbox" class="roleC" value="Eksper Firması">
     Eksper Firması
    </label>
   </div>

   <div class="formGrid">

    <div class="field full">
     <label id="nameLabel">Ad Soyad</label>
     <input id="name" placeholder="Ad Soyad">
    </div>

    <div class="field" id="tcBox">
     <label>T.C. Kimlik No</label>
     <input id="tc">
    </div>

    <div class="field" id="vdBox" style="display:none">
     <label>Vergi Dairesi</label>
     <input id="vd">
    </div>

    <div class="field" id="vnBox" style="display:none">
     <label>Vergi No</label>
     <input id="vn">
    </div>

    <div class="field" id="yetBox" style="display:none">
     <label>Yetkili Kişi</label>
     <input id="yet">
    </div>

    <div class="field">
     <label>Telefon</label>
     <input id="tel" placeholder="05xx xxx xx xx">
    </div>

    <div class="field">
     <label>E-posta</label>
     <input id="mail">
    </div>

    <div class="field full">
     <label>Adres</label>
     <textarea id="adres"></textarea>
    </div>

    <div class="field full">
     <label>Notlar</label>
     <textarea id="notlar" placeholder="Cari hakkında not..."></textarea>
    </div>

   </div>

   <button class="save" onclick="saveCari()">
    ✓ Cari Kartını Kaydet
   </button>

  </div>
 </div>
</div>

<!-- CARİ DETAY -->
<div id="detail" class="detail">

 <div class="detailHead">
  <div class="detailTop">

   <button class="back" onclick="closeDetail()">‹</button>

   <div>
    <div id="detailName" class="detailTitle"></div>
    <div id="detailCode" class="detailCode"></div>
   </div>

  </div>
 </div>

 <div class="container">

  <div class="summary">

   <div class="sum">
    <span>Toplam Borç</span>
    <b class="red" id="sumBorc">0,00 ₺</b>
   </div>

   <div class="sum">
    <span>Toplam Alacak</span>
    <b class="green" id="sumAlacak">0,00 ₺</b>
   </div>

   <div class="sum">
    <span>Bakiye</span>
    <b class="blue" id="sumBakiye">0,00 ₺</b>
   </div>

   <div class="sum">
    <span>Araç Sayısı</span>
    <b id="sumArac">0</b>
   </div>

  </div>

  <div class="detailTabs">
   <button class="dtab on"
    onclick="showPanel('ozet',this)">Genel Bakış</button>

   <button class="dtab"
    onclick="showPanel('araclar',this)">Araçlar</button>

   <button class="dtab"
    onclick="showPanel('hareket',this)">Cari Hareketler</button>

   <button class="dtab"
    onclick="showPanel('isemri',this)">İş Emirleri</button>

   <button class="dtab"
    onclick="showPanel('fatura',this)">Faturalar</button>

   <button class="dtab"
    onclick="showPanel('hasar',this)">Hasar & Sigorta</button>

   <button class="dtab"
    onclick="showPanel('belge',this)">Belgeler</button>

   <button class="dtab"
    onclick="showPanel('not',this)">Notlar</button>
  </div>

  <div id="panel" class="panel"></div>

 </div>
</div>

<script>

/* ================================
   VERİTABANI - LOCAL STORAGE
================================ */

let cariler =
JSON.parse(localStorage.getItem("mau_cariler") || "[]");

let hareketler =
JSON.parse(localStorage.getItem("mau_cari_hareketler") || "[]");

let araclar =
JSON.parse(localStorage.getItem("mau_cari_araclar") || "[]");

let currentFilter="Tümü";
let currentType="Bireysel";
let editId=null;
let activeCari=null;


/* ================================
   KAYIT
================================ */

function saveAll(){

 localStorage.setItem(
  "mau_cariler",
  JSON.stringify(cariler)
 );

 localStorage.setItem(
  "mau_cari_hareketler",
  JSON.stringify(hareketler)
 );

 localStorage.setItem(
  "mau_cari_araclar",
  JSON.stringify(araclar)
 );
}


/* ================================
   PARA
================================ */

function money(n){

 return Number(n||0).toLocaleString(
  "tr-TR",
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 )+" ₺";

}


/* ================================
   GÜVENLİ METİN
================================ */

function esc(v){

 return String(v||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;");

}


/* ================================
   CARİ KODU
================================ */

function codeCreate(){

 let max=0;

 cariler.forEach(c=>{

  let n=parseInt(
   (c.code||"").replace(/\D/g,"")
  );

  if(n>max) max=n;

 });

 return "CR-"+String(max+1).padStart(5,"0");

}


/* ================================
   BİREYSEL / KURUMSAL
================================ */

function selectType(type){

 currentType=type;

 document
 .getElementById("b1")
 .classList.toggle(
  "selected",
  type==="Bireysel"
 );

 document
 .getElementById("b2")
 .classList.toggle(
  "selected",
  type==="Kurumsal"
 );

 let k=type==="Kurumsal";

 document.getElementById("nameLabel").innerText=
 k ? "Firma / Ticari Unvan" : "Ad Soyad";

 document.getElementById("name").placeholder=
 k ? "Firma veya ticari unvan" : "Ad Soyad";

 document.getElementById("tcBox").style.display=
 k ? "none" : "block";

 document.getElementById("vdBox").style.display=
 k ? "block" : "none";

 document.getElementById("vnBox").style.display=
 k ? "block" : "none";

 document.getElementById("yetBox").style.display=
 k ? "block" : "none";

}


/* ================================
   FORM TEMİZLE
================================ */

function clearForm(){

 [
  "name",
  "tc",
  "vd",
  "vn",
  "yet",
  "tel",
  "mail",
  "adres",
  "notlar"
 ]
 .forEach(id=>{
  document.getElementById(id).value="";
 });

 document
 .querySelectorAll(".roleC")
 .forEach(x=>{
  x.checked=false;
 });

}


/* ================================
   CARİ FORMU AÇ
================================ */

function openForm(id=null){

 editId=id;

 clearForm();

 if(id){

  let c=cariler.find(x=>x.id===id);

  if(!c) return;

  document.getElementById("formTitle").innerText=
  "Cari Kartını Düzenle";

  selectType(c.type);

  [
   "name",
   "tc",
   "vd",
   "vn",
   "yet",
   "tel",
   "mail",
   "adres",
   "notlar"
  ]
  .forEach(k=>{

   document.getElementById(k).value=
   c[k] || "";

  });

  document
  .querySelectorAll(".roleC")
  .forEach(x=>{

   x.checked=
   (c.roles||[]).includes(x.value);

  });

 }else{

  document.getElementById("formTitle").innerText=
  "Yeni Cari Kartı";

  selectType("Bireysel");

 }

 document.getElementById("modal").style.display=
 "block";

}


/* ================================
   FORM KAPAT
================================ */

function closeForm(){

 document.getElementById("modal").style.display=
 "none";

}


/* ================================
   CARİ KAYDET
================================ */

function saveCari(){

 let name=
 document.getElementById("name").value.trim();

 let roles=[
  ...document.querySelectorAll(".roleC:checked")
 ]
 .map(x=>x.value);

 if(!name){

  alert("Ad / Firma bilgisi giriniz.");

  return;
 }

 if(!roles.length){

  alert("En az bir cari rolü seçiniz.");

  return;
 }

 let old=
 editId
 ? cariler.find(x=>x.id===editId)
 : null;

 let data={

  id:
  editId || Date.now(),

  code:
  old ? old.code : codeCreate(),

  type:
  currentType,

  roles:
  roles,

  name:
  name,

  tc:
  document.getElementById("tc").value.trim(),

  vd:
  document.getElementById("vd").value.trim(),

  vn:
  document.getElementById("vn").value.trim(),

  yet:
  document.getElementById("yet").value.trim(),

  tel:
  document.getElementById("tel").value.trim(),

  mail:
  document.getElementById("mail").value.trim(),

  adres:
  document.getElementById("adres").value.trim(),

  notlar:
  document.getElementById("notlar").value.trim(),

  active:
  old ? old.active : true,

  created:
  old
  ? old.created
  : new Date().toISOString()

 };

 if(editId){

  let i=
  cariler.findIndex(
   x=>x.id===editId
  );

  cariler[i]=data;

 }else{

  cariler
