<html lang="tr">
<head>

<title>MAU Oto Servis - Cariler</title>
<style>

.claimsTable th:nth-child(2),.claimsTable td:nth-child(2){width:14%}

.claimsTable th:nth-child(5),.claimsTable td:nth-child(5){width:23%}
.claimsTable th:nth-child(6),.claimsTable td:nth-child(6){width:14%}
.docsTable th:nth-child(1),.docsTable td:nth-child(1){width:15%}
.docsTable th:nth-child(2),.docsTable td:nth-child(2){width:12%}
.docsTable th:nth-child(3),.docsTable td:nth-child(3){width:31%}

button,input,textarea,select{font:inherit}button{cursor:pointer}
header,.detailHead{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
header{padding:18px}.detailHead{padding:16px}
.head,.detailTop{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px}
.back{background:#ffffff18;border:0;color:#fff;width:42px;height:42px;border-radius:10px;font-size:22px}
.logo{font-size:23px;font-weight:800}.sub{font-size:13px;opacity:.85;margin-top:3px}
.container{max-width:1200px;margin:auto;padding:18px}
.toolbar{display:flex;gap:10px;margin-bottom:12px}.search{flex:1;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.add{border:0;background:var(--green);color:#fff;font-weight:700;padding:0 20px;border-radius:12px}
.tabs,.detailTabs{display:flex;gap:8px;margin:12px 0}.tabs{flex-wrap:wrap}.detailTabs{overflow:auto;flex-wrap:nowrap;padding-bottom:4px}
.tab,.dtab{border:0;background:#fff;padding:11px 16px;border-radius:22px;box-shadow:0 2px 8px #0000000c;white-space:nowrap}
.dtab{border-radius:9px}.tab.on,.dtab.on{background:var(--blue);color:#fff}
.stats,.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.stat,.sum{background:#fff;border-radius:13px;padding:14px;box-shadow:0 2px 10px #0000000b}.stat{text-align:center}
.stat b{display:block;font-size:24px;color:#0864b8}.stat span,.sum span{font-size:13px;color:var(--muted)}.sum b{display:block;font-size:20px;margin-top:5px}
.green{color:#078744}.red{color:var(--red)}.blue{color:#0864b8}.amber{color:var(--amber)}
.card{background:#fff;border-radius:15px;padding:17px;margin-bottom:12px;box-shadow:0 3px 14px #0000000c}
.name{font-size:19px;font-weight:800}.code{font-size:12px;color:#7b8794;margin:5px 0}.badges{margin:8px 0}
.badge{display:inline-block;background:#e9f3ff;color:#075ca8;padding:5px 9px;margin:2px;border-radius:10px;font-size:12px}.badge.type{background:#e8f7ef;color:#087840}
.info{font-size:13px;line-height:1.7;color:#536170}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}
.actions button{border:0;padding:11px 5px;border-radius:9px;font-weight:700}.open{background:var(--blue);color:#fff}.edit{background:#eaf2ff;color:#0756a5}.pass{background:#fff2df;color:#9b6200}.del{background:#ffe8eb;color:#a21c2b}
.empty{background:#fff;text-align:center;padding:50px 15px;border-radius:15px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:1000;overflow:auto;padding:15px}.box{max-width:760px;background:#fff;margin:20px auto;border-radius:16px;overflow:hidden}
.boxHead{background:var(--blue);color:#fff;padding:17px;font-size:19px;font-weight:800;display:flex;justify-content:space-between}.boxBody{padding:17px}
.typeRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.typeBtn{border:1px solid var(--line);background:#fff;padding:14px;border-radius:10px}.typeBtn.selected{border:2px solid var(--blue);background:#f1f7ff}
.roleGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 18px}.role{border:1px solid #e0e6ed;padding:12px;border-radius:9px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#4c5968}input,textarea,select{width:100%;border:1px solid var(--line);padding:12px;border-radius:9px;font-size:14px}
textarea{min-height:75px}.save{width:100%;background:#09a44f;color:#fff;border:0;padding:14px;border-radius:10px;font-size:16px;font-weight:800}
.detail{display:none;position:fixed;inset:0;background:var(--bg);z-index:900;overflow:auto}.detailTitle{font-size:21px;font-weight:800}.detailCode{font-size:12px;opacity:.85}
.panel{background:#fff;border-radius:14px;padding:16px;min-height:260px;box-shadow:0 2px 12px #0000000b}.panelTitle{font-size:18px;font-weight:800;margin-bottom:13px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.quick button{border:0;background:#eaf3ff;color:#075ba8;padding:10px 13px;border-radius:8px;font-weight:700}.quick .pdf{background:#ffe9ec;color:#a11e30}
.note{padding:12px;border-radius:10px;background:#f7f9fc;color:#52606d;margin-bottom:14px}.note b{color:#23364d}
.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;border-bottom:1px solid #edf0f3;padding:10px 8px;font-size:12px;vertical-align:top}th{background:#f7f9fc}
.overviewGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.overCard{border:1px solid #e8edf2;border-radius:12px;padding:14px}.overCard h3{margin:0 0 10px;font-size:15px}
.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;background:#f7f9fc;padding:10px;border-radius:10px;margin-bottom:14px}.filters button{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:0 14px}
.small{font-size:11px;color:var(--muted)}.linkish{color:#075ba8;font-weight:700}.status{font-weight:700}
@media(max-width:700px){
 .stats,.summary{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.formGrid,.roleGrid,.overviewGrid{grid-template-columns:1fr}
 .filters{grid-template-columns:1fr 1fr}.filters button{grid-column:1/-1;min-height:42px}
 #panel .tableWrap{overflow:visible}
 .fitTable th,.fitTable td,.movementTable th,.movementTable td{font-size:9px;padding:4px 3px;line-height:1.2}
}
</style>
</head>
<body>

<header>
 <div class="head">
  <button class="back" onclick="location.href='index.html'">‹</button>
  <div><div class="logo">M•• MAU OTO SERVİS</div><div class="sub">Cariler · Müşteri · Tedarikçi · Sigorta · Eksper</div></div>
 </div>
</header>

<div class="container">
 <div class="toolbar">
  <input id="search" class="search" placeholder="Ad, firma, telefon, vergi no, cari kodu ara..." oninput="render()">
  <button class="add" onclick="openForm()">+ Yeni Cari</button>
 </div>

 <div class="tabs">
  <button class="tab on" onclick="setFilter('Tümü',this)">Tümü</button>
  <button class="tab" onclick="setFilter('Müşteri',this)">Müşteriler</button>
  <button class="tab" onclick="setFilter('Tedarikçi',this)">Tedarikçiler</button>
  <button class="tab" onclick="setFilter('Sigorta Şirketi',this)">Sigorta Şirketleri</button>
  <button class="tab" onclick="setFilter('Eksper Firması',this)">Eksper Firmaları</button>
 </div>

 <div class="stats">
  <div class="stat"><b id="m">0</b><span>Müşteri</span></div>
  <div class="stat"><b id="t">0</b><span>Tedarikçi</span></div>
  <div class="stat"><b id="s">0</b><span>Sigorta</span></div>
  <div class="stat"><b id="e">0</b><span>Eksper</span></div>
 </div>

 <div id="list"></div>
</div>

<div id="modal" class="modal">
 <div class="box">
  <div class="boxHead"><span id="formTitle">Yeni Cari Kartı</span><span onclick="closeForm()" style="cursor:pointer">×</span></div>
  <div class="boxBody">
   <b>Cari Tipi</b>
   <div class="typeRow">
    <button id="b1" class="typeBtn selected" onclick="selectType('Bireysel')">👤 Bireysel</button>
    <button id="b2" class="typeBtn" onclick="selectType('Kurumsal')">🏢 Kurumsal</button>
   </div>

   <b>Cari Rolü</b>
   <div class="roleGrid">
    <label class="role"><input type="checkbox" class="roleC" value="Müşteri"> Müşteri</label>
    <label class="role"><input type="checkbox" class="roleC" value="Tedarikçi"> Tedarikçi</label>
    <label class="role"><input type="checkbox" class="roleC" value="Sigorta Şirketi"> Sigorta Şirketi</label>
    <label class="role"><input type="checkbox" class="roleC" value="Eksper Firması"> Eksper Firması</label>
   </div>

   <div class="formGrid">
    <div class="field full"><label id="nameLabel">Ad Soyad</label><input id="name" placeholder="Ad Soyad"></div>
    <div class="field" id="tcBox"><label>T.C. Kimlik No</label><input id="tc"></div>
    <div class="field" id="vdBox" style="display:none"><label>Vergi Dairesi</label><input id="vd"></div>
    <div class="field" id="vnBox" style="display:none"><label>Vergi No</label><input id="vn"></div>
    <div class="field" id="yetBox" style="display:none"><label>Yetkili Kişi</label><input id="yet"></div>
    <div class="field"><label>Telefon</label><input id="tel" placeholder="05xx xxx xx xx"></div>
    <div class="field"><label>E-posta</label><input id="mail"></div>
    <div class="field full"><label>Adres</label><textarea id="adres"></textarea></div>
    <div class="field full"><label>Notlar</label><textarea id="notlar" placeholder="Cari hakkında not..."></textarea></div>
   </div>

   <button class="save" onclick="saveCari()">✓ Cari Kartını Kaydet</button>
  </div>
 </div>
</div>

<div id="detail" class="detail">
 <div class="detailHead">
  <div class="detailTop">
   <button class="back" onclick="closeDetail()">‹</button>
   <div><div id="detailName" class="detailTitle"></div><div id="detailCode" class="detailCode"></div></div>
  </div>
 </div>

 <div class="container">
  <div class="summary">
   <div class="sum"><span>Toplam Borç</span><b class="red" id="sumBorc">0,00 ₺</b></div>
   <div class="sum"><span>Toplam Alacak</span><b class="green" id="sumAlacak">0,00 ₺</b></div>
   <div class="sum"><span>Bakiye</span><b class="blue" id="sumBakiye">0,00 ₺</b></div>
   <div class="sum"><span>Araç Sayısı</span><b id="sumArac">0</b></div>
  </div>

  <div class="detailTabs">
   <button class="dtab on" data-panel="ozet" onclick="showPanel('ozet')">Genel Bakış</button>
   <button class="dtab" data-panel="araclar" onclick="showPanel('araclar')">Araçlar</button>
   <button class="dtab" data-panel="hareket" onclick="showPanel(&quot;hareket&quot;)">Cari Hareketler</button>
   <button class="dtab" data-panel="isemri" onclick="showPanel('isemri')">İş Emirleri</button>
   <button class="dtab" data-panel="fatura" onclick="showPanel('fatura')">Faturalar</button>
   <button class="dtab" data-panel="hasar" onclick="showPanel('hasar')">Hasar & Sigorta</button>
   <button class="dtab" data-panel="belge" onclick="showPanel('belge')">Belgeler</button>
   <button class="dtab" data-panel="not" onclick="showPanel('not')">Notlar</button>
  </div>

  <div id="panel" class="panel"></div>
 </div>
</div>

<script>
const KEYS={
 cariler:"mau_cariler",
 legacyCariler:["mau_oto_servis_cariler"],
 araclar:["mau_araclar","mau_cari_araclar"],
 isEmirleri:["mau_is_emirleri"],
 faturalar:["mau_faturalar"],
 tahsilatlar:["mau_tahsilatlar"],
 odemeler:["mau_odemeler"],
 hasarlar:["mau_hasar_dosyalari","mau_hasarlari"],
 belgeler:["mau_belgeler"],
 legacyHareket:["mau_cari_hareketler"]
};

function loadArray(key){
 try{
  const v=JSON.parse(localStorage.getItem(key)||"[]");
  return Array.isArray(v)?v:[];
 }catch(e){
  console.error(key+" okunamadı",e);
  return [];
 }
}
function loadMany(keys){
 const out=[],seen=new Set();
 keys.forEach(function(k){
  loadArray(k).forEach(function(x){
   const token=String(x.id??x.uuid??x.code??x.plaka??JSON.stringify(x));
   if(!seen.has(token)){seen.add(token);out.push(x);}
  });
 });
 return out;
}
function saveCariler(){localStorage.setItem(KEYS.cariler,JSON.stringify(cariler));}
function loadCarilerWithMigration(){
 const current=loadArray(KEYS.cariler);
 const legacy=loadMany(KEYS.legacyCariler||[]);
 const out=[],seen=new Set();

 current.concat(legacy).forEach(function(c){
  if(!c)return;
  const token=String(c.id??c.code??((c.name||"")+"|"+((c.roles||[]).join(","))));
  if(!seen.has(token)){seen.add(token);out.push(c);}
 });

 // Test aşamasında liste tamamen boş kalırsa temel test carilerini geri getir.
 if(!out.length){
  out.push(
   {
    id:"TEST-MUSTERI-001",code:"CR-00002",type:"Bireysel",roles:["Müşteri"],
    name:"TEST MÜŞTERİ",tc:"",vd:"",vn:"",yet:"",tel:"",mail:"",adres:"",
    notlar:"Araç kayıt ve servis akışı için test carisi",active:true,created:new Date().toISOString()
   },
   {
    id:"TEST-TEDARIKCI-001",code:"CR-00001",type:"Kurumsal",roles:["Tedarikçi"],
    name:"TEST TEDARİKÇİ",tc:"",vd:"",vn:"",yet:"",tel:"",mail:"",adres:"",
    notlar:"Cari modülü test kaydı",active:true,created:new Date().toISOString()
   }
  );
 }

 // Eski sürümdeki mau_oto_servis_cariler anahtarından gelen kayıtları yeni anahtara taşır.
 localStorage.setItem(KEYS.cariler,JSON.stringify(out));
 return out;
}
function money(n){return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺";}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pick(o,names,def=""){
 for(const n of names){if(o&&o[n]!=null&&o[n]!=="")return o[n];}
 return def;
}
function num(o,names){
 const v=pick(o,names,0);
 const n=Number(String(v).replaceAll(".","").replace(",","."));
 return Number.isFinite(n)?n:0;
}
function dateVal(o){return String(pick(o,["tarih","date","createdAt","created","islemTarihi","faturaTarihi"],""));}
function codeCreate(){
 let max=0;
 cariler.forEach(function(c){
  const n=parseInt((c.code||"").replace(/\D/g,""),10);
  if(Number.isFinite(n)&&n>max)max=n;
 });
 return "CR-"+String(max+1).padStart(5,"0");
}
function findCari(id){return cariler.find(function(x){return String(x.id)===String(id);});}

let cariler=loadCarilerWithMigration();
let currentFilter="Tümü";
let currentType="Bireysel";
let editId=null;
let activeCari=null;
let activePanel="ozet";

function selectType(type){
 currentType=type;
 document.getElementById("b1").classList.toggle("selected",type==="Bireysel");
 document.getElementById("b2").classList.toggle("selected",type==="Kurumsal");
 const k=type==="Kurumsal";
 document.getElementById("nameLabel").innerText=k?"Firma / Ticari Unvan":"Ad Soyad";
 document.getElementById("name").placeholder=k?"Firma veya ticari unvan":"Ad Soyad";
 document.getElementById("tcBox").style.display=k?"none":"block";
 document.getElementById("vdBox").style.display=k?"block":"none";
 document.getElementById("vnBox").style.display=k?"block":"none";
 document.getElementById("yetBox").style.display=k?"block":"none";
}
function clearForm(){
 ["name","tc","vd","vn","yet","tel","mail","adres","notlar"].forEach(function(id){document.getElementById(id).value="";});
 document.querySelectorAll(".roleC").forEach(function(x){x.checked=false;});
}
function openForm(id){
 if(typeof id==="undefined")id=null;
 editId=id;clearForm();
 if(id!==null){
  const c=findCari(id);if(!c)return;
  document.getElementById("formTitle").innerText="Cari Kartını Düzenle";
  selectType(c.type||"Bireysel");
  ["name","tc","vd","vn","yet","tel","mail","adres","notlar"].forEach(function(k){document.getElementById(k).value=c[k]||"";});
  document.querySelectorAll(".roleC").forEach(function(x){x.checked=(c.roles||[]).includes(x.value);});
 }else{
  document.getElementById("formTitle").innerText="Yeni Cari Kartı";
  selectType("Bireysel");
 }
 document.getElementById("modal").style.display="block";
}
function closeForm(){document.getElementById("modal").style.display="none";}
function saveCari(){
 const name=document.getElementById("name").value.trim();
 const roles=Array.from(document.querySelectorAll(".roleC:checked")).map(function(x){return x.value;});
 if(!name){alert("Ad / Firma bilgisi giriniz.");return;}
 if(!roles.length){alert("En az bir cari rolü seçiniz.");return;}
 const old=editId!==null?findCari(editId):null;
 const data={
  id:old?old.id:Date.now(),code:old?old.code:codeCreate(),type:currentType,roles:roles,name:name,
  tc:document.getElementById("tc").value.trim(),vd:document.getElementById("vd").value.trim(),
  vn:document.getElementById("vn").value.trim(),yet:document.getElementById("yet").value.trim(),
  tel:document.getElementById("tel").value.trim(),mail:document.getElementById("mail").value.trim(),
  adres:document.getElementById("adres").value.trim(),notlar:document.getElementById("notlar").value.trim(),
  active:old?old.active!==false:true,created:old&&old.created?old.created:new Date().toISOString()
 };
 if(old){
  const i=cariler.findIndex(function(x){return String(x.id)===String(old.id);});
  cariler[i]=data;
 }else{cariler.unshift(data);}
 saveCariler();closeForm();render();
}
function setFilter(f,btn){
 currentFilter=f;
 document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});
 btn.classList.add("on");render();
}
function toggleActive(id){
 const c=findCari(id);if(!c)return;
 c.active=c.active===false;saveCariler();render();
}
function belongsToCari(o,c){
 if(!o||!c)return false;
 const ids=[o.cariId,o.cari_id,o.customerId,o.musteriId,o.tedarikciId,o.sigortaCariId,o.eksperCariId].filter(v=>v!=null&&v!=="");
 if(ids.some(v=>String(v)===String(c.id)))return true;
 const codes=[o.cariCode,o.cariKodu,o.customerCode,o.musteriKodu,o.tedarikciKodu].filter(Boolean);
 if(codes.some(v=>String(v)===String(c.code)))return true;
 const names=[o.cariAdi,o.cari,o.musteriAdi,o.musteri,o.tedarikciAdi,o.tedarikci].filter(Boolean);
 return names.some(v=>String(v).trim().toLocaleLowerCase("tr-TR")===String(c.name||"").trim().toLocaleLowerCase("tr-TR"));
}
function linkedRecords(c){
 return {

 };

function deleteCari(id){

 if(count>0){alert("Bu cariye bağlı kayıtlar var. Veri kaybını önlemek için silmek yerine Pasife Al kullanın.");return;}

function invoiceMatchesWorkOrder(inv,wo){
 const iid=pick(inv,["isEmriId","workOrderId"],"");
 const wid=pick(wo,["id","uuid"],"");
 if(iid&&wid&&String(iid)===String(wid))return true;
 const ino=String(pick(inv,["isEmriNo","workOrderNo"],""));
 const wno=String(pick(wo,["isEmriNo","no","workOrderNo"],""));
 return !!ino&&!!wno&&ino===wno;
}
function normalizeLegacy(h){
 let borc=Number(h.borc||0),alacak=Number(h.alacak||0);
 if(!borc&&!alacak&&h.tip==="Borç")borc=Number(h.tutar||0);
 if(!borc&&!alacak&&h.tip==="Alacak")alacak=Number(h.tutar||0);
 return {
  id:h.id,eventKey:h.eventKey||("legacy:"+h.id),tarih:dateVal(h),kaynak:h.kaynak||"Eski Kayıt",
  belgeNo:pick(h,["belgeNo","belge"],""),isEmriNo:pick(h,["isEmriNo"],""),plaka:pick(h,["plaka"],""),
  aciklama:pick(h,["aciklama"],""),borc:borc,alacak:alacak,etki:h.etki!==false,durum:h.durum||"Aktif"
 };
}
function buildMovements(){
 if(!activeCari)return[];
 const out=[];
 const invs=activeInvoices();

 activeWorkOrders().forEach(function(w){
  const status=String(pick(w,["durum","status"],"")).toLocaleLowerCase("tr-TR");
  const closed=["kapandı","kapali","kapalı","tamamlandı","tamamlandi","teslim","closed","completed"].some(x=>status.includes(x));
  if(!closed)return;
  const faturalandi=invs.some(inv=>invoiceMatchesWorkOrder(inv,w));
  out.push({
   id:pick(w,["id","uuid"],Date.now()),eventKey:"wo:"+pick(w,["id","uuid","isEmriNo","no"],Date.now()),
   tarih:dateVal(w),kaynak:"İş Emri",belgeNo:"",isEmriNo:pick(w,["isEmriNo","no","workOrderNo"],""),
   plaka:pick(w,["plaka","vehiclePlate"],""),aciklama:pick(w,["aciklama","islemOzeti","islem","description"],"İş emri kapandı"),
   borc:faturalandi?0:num(w,["genelToplam","toplam","tutar","kalan"]),alacak:0,etki:!faturalandi,durum:faturalandi?"Faturalandı":"Kapandı"
  });
 });

 invs.forEach(function(f){
  const tip=String(pick(f,["tip","tur","faturaTipi","type"],"")).toLocaleLowerCase("tr-TR");
  const alis=tip.includes("alış")||tip.includes("alis")||tip.includes("purchase")||tip.includes("tedarik");
  const tutar=num(f,["genelToplam","toplam","tutar","netToplam"]);
  out.push({
   id:pick(f,["id","uuid"],Date.now()),eventKey:"inv:"+pick(f,["id","uuid","faturaNo","no"],Date.now()),
   tarih:dateVal(f),kaynak:alis?"Alış Faturası":"Satış Faturası",belgeNo:pick(f,["faturaNo","no","belgeNo"],""),
   isEmriNo:pick(f,["isEmriNo","workOrderNo"],""),plaka:pick(f,["plaka","vehiclePlate"],""),
   aciklama:pick(f,["aciklama","description"],alis?"Tedarikçi alış faturası":"Müşteri satış faturası"),
   borc:alis?0:tutar,alacak:alis?tutar:0,etki:true,durum:pick(f,["durum","status"],"Aktif")
  });
 });

 activeCollections().forEach(function(t){
  const tutar=num(t,["tutar","amount"]);
  out.push({
   id:pick(t,["id","uuid"],Date.now()),eventKey:"tah:"+pick(t,["id","uuid","makbuzNo","no"],Date.now()),
   tarih:dateVal(t),kaynak:"Tahsilat",belgeNo:pick(t,["makbuzNo","no","belgeNo"],""),
   isEmriNo:pick(t,["isEmriNo"],""),plaka:pick(t,["plaka"],""),aciklama:pick(t,["aciklama"],"Tahsilat"),
   borc:0,alacak:tutar,etki:true,durum:pick(t,["durum"],"Aktif")
  });
 });

 activePayments().forEach(function(o){
  const tutar=num(o,["tutar","amount"]);
  out.push({
   id:pick(o,["id","uuid"],Date.now()),eventKey:"odm:"+pick(o,["id","uuid","makbuzNo","no"],Date.now()),
   tarih:dateVal(o),kaynak:"Ödeme",belgeNo:pick(o,["makbuzNo","no","belgeNo"],""),
   isEmriNo:pick(o,["isEmriNo"],""),plaka:pick(o,["plaka"],""),aciklama:pick(o,["aciklama"],"Ödeme"),
   borc:tutar,alacak:0,etki:true,durum:pick(o,["durum"],"Aktif")
  });
 });

 loadMany(KEYS.legacyHareket).filter(x=>belongsToCari(x,activeCari)).forEach(function(h){out.push(normalizeLegacy(h));});

 const seen=new Set();
 return out.filter(function(x){
  const k=x.eventKey||String(x.id);
  if(seen.has(k))return false;seen.add(k);return true;
 });
}
function movementTS(h){
 const t=Date.parse(h.tarih||"");
 return Number.isFinite(t)?t:Number(h.id||0);
}
function movementsWithBalance(list){
 let bakiye=0;
 return list.slice().sort((a,b)=>movementTS(a)-movementTS(b)).map(function(h){
  if(h.etki!==false)bakiye+=Number(h.borc||0)-Number(h.alacak||0);
  return Object.assign({},h,{bakiye:bakiye});
 });
}
function updateSummary(){
 const hs=buildMovements().filter(h=>h.etki!==false);
 const borc=hs.reduce((a,h)=>a+Number(h.borc||0),0);
 const alacak=hs.reduce((a,h)=>a+Number(h.alacak||0),0);
 document.getElementById("sumBorc").innerText=money(borc);
 document.getElementById("sumAlacak").innerText=money(alacak);
 const net=borc-alacak,b=document.getElementById("sumBakiye");
 b.innerText=money(net);b.className=net>0?"red":net<0?"green":"blue";
 document.getElementById("sumArac").innerText=activeVehicles().length;
}

/* BÖLÜM BAZLI PDF RAPORLARI */
function printSection(type){
 if(!activeCari){alert("Cari seçili değil.");return;}

 const titleMap={
  cari:"Cari Kartı",
  araclar:"Araçlar",
  hareket:"Cari Hesap Ekstresi",
  isemri:"İş Emirleri",
  fatura:"Faturalar",
  hasar:"Hasar & Sigorta",
  belge:"Belgeler",
  not:"Notlar"
 };
 const title=titleMap[type]||"Cari Raporu";

 function table(headers,rows){
  return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+
   (rows||'<tr><td colspan="'+headers.length+'">Kayıt yok.</td></tr>')+'</tbody></table>';
 }
 function rowsFrom(list,cols){
  if(!list.length)return '';
  return list.map(x=>'<tr>'+cols.map(fn=>'<td>'+esc(fn(x))+'</td>').join('')+'</tr>').join('');
 }

 const movesAll=movementsWithBalance(buildMovements());
 const effective=movesAll.filter(h=>h.etki!==false);
 const borc=effective.reduce((a,h)=>a+Number(h.borc||0),0);
 const alacak=effective.reduce((a,h)=>a+Number(h.alacak||0),0);

 let body='';

 if(type==="cari"){
  body=
   '<div class="box"><b>'+esc(activeCari.name)+'</b><br>'+
   'Cari Kodu: '+esc(activeCari.code||"-")+'<br>'+
   'Cari Tipi: '+esc(activeCari.type||"-")+'<br>'+
   'Roller: '+esc((activeCari.roles||[]).join(" / ")||"-")+'<br>'+
   'Telefon: '+esc(activeCari.tel||"-")+'<br>'+
   'E-posta: '+esc(activeCari.mail||"-")+'<br>'+
   'T.C. / Vergi No: '+esc(activeCari.tc||activeCari.vn||"-")+'<br>'+
   'Vergi Dairesi: '+esc(activeCari.vd||"-")+'<br>'+
   'Yetkili: '+esc(activeCari.yet||"-")+'<br>'+
   'Adres: '+esc(activeCari.adres||"-")+'</div>'+
   '<div class="tot">Toplam Borç: <b>'+money(borc)+'</b><br>Toplam Alacak: <b>'+money(alacak)+'</b><br>Bakiye: <b>'+money(borc-alacak)+'</b><br>Araç Sayısı: <b>'+activeVehicles().length+'</b></div>';
 }

 if(type==="araclar"){
  const list=activeVehicles();
  const rows=rowsFrom(list,[
   v=>pick(v,["plaka"],"-"),
   v=>[pick(v,["marka"],""),pick(v,["model"],"")].filter(Boolean).join(" ")||"-",
   v=>pick(v,["sasi","vin","sasiNo"],"-"),
   v=>pick(v,["motorNo"],"-"),
   v=>pick(v,["km","kilometre"],"-"),
   v=>pick(v,["durum"],"Aktif")
  ]);
  body=table(["Plaka","Marka / Model","Şasi / VIN","Motor No","KM","Durum"],rows);
 }

 if(type==="hareket"){
  const from=document.getElementById("fromDate")?.value||"";
  const to=document.getElementById("toDate")?.value||"";
  const list=movesAll.filter(h=>(!from||String(h.tarih)>=from)&&(!to||String(h.tarih)<=to));
  const rows=list.length?list.map(h=>'<tr><td>'+esc(h.tarih||"")+'</td><td>'+esc(h.kaynak||"")+'</td><td>'+esc(h.belgeNo||"-")+'</td><td>'+esc(h.isEmriNo||"-")+'</td><td>'+esc(h.plaka||"-")+'</td><td>'+esc(h.aciklama||"-")+'</td><td>'+(h.borc?money(h.borc):"-")+'</td><td>'+(h.alacak?money(h.alacak):"-")+'</td><td>'+money(h.bakiye)+'</td></tr>').join(""):'';
  body=(from||to?'<div class="box">Tarih Aralığı: '+esc(from||"Başlangıç")+' - '+esc(to||"Bugün")+'</div>':'')+
   table(["Tarih","Kaynak","Belge No","İş Emri","Plaka","Açıklama","Borç","Alacak","Bakiye"],rows)+
   '<div class="tot">Toplam Borç: <b>'+money(borc)+'</b><br>Toplam Alacak: <b>'+money(alacak)+'</b><br>Bakiye: <b>'+money(borc-alacak)+'</b></div>';
 }

 if(type==="isemri"){
  const list=activeWorkOrders();
  const rows=rowsFrom(list,[
   w=>pick(w,["isEmriNo","no","workOrderNo"],"-"),
   w=>dateVal(w)||"-",
   w=>pick(w,["plaka"],"-"),
   w=>pick(w,["durum","status"],"-"),
   w=>money(num(w,["genelToplam","toplam","tutar"])),
   w=>pick(w,["aciklama","islemOzeti"],"-")
  ]);
  body=table(["İş Emri No","Tarih","Plaka","Durum","Tutar","Açıklama"],rows);
 }

 if(type==="fatura"){
  const list=activeInvoices();
  body=list.length?list.map(function(f){
   const data=invoiceLines(f),lineRows=[];
   data.iscilikler.forEach(function(x){
    const qty=Number(x.saat||0),price=Number(x.birimFiyat||x.birim||0);
    lineRows.push('<tr><td>İşçilik</td><td>'+esc(x.islem||x.ad||"-")+'</td><td>'+esc(qty)+'</td><td>Saat</td><td>'+money(price)+'</td><td>'+money(qty*price)+'</td></tr>');
   });
   data.parcalar.forEach(function(x){
    const qty=Number(x.adet||x.miktar||0),price=Number(x.birimFiyat||x.fiyat||0);
    lineRows.push('<tr><td>Parça</td><td>'+esc(x.ad||x.name||"-")+(x.kod?' ('+esc(x.kod)+')':'')+'</td><td>'+esc(qty)+'</td><td>'+esc(x.birim||"Adet")+'</td><td>'+money(price)+'</td><td>'+money(qty*price)+'</td></tr>');
   });
   const total=num(f,["genelToplam","toplam","tutar"]),tax=num(f,["kdvTutar"]),sub=num(f,["araToplam"])||Math.max(0,total-tax);
   return '<div class="box" style="margin-bottom:12px"><b>'+esc(pick(f,["faturaNo","no","belgeNo"],"-"))+'</b> · '+esc(dateVal(f)||"-")+' · İş Emri '+esc(pick(f,["isEmriNo"],"-"))+' · '+esc(pick(f,["plaka"],"-"))+'</div>'+
    table(["Tür","İşlem / Parça","Miktar","Birim","Birim Fiyat","Tutar"],lineRows.join(""))+
    '<div class="tot" style="margin:6px 0 18px">Ara Toplam: <b>'+money(sub)+'</b><br>KDV: <b>'+money(tax)+'</b><br>Genel Toplam: <b>'+money(total)+'</b></div>';
  }).join(""):'<div class="box">Bu cariye bağlı fatura yok.</div>';
 }

 if(type==="hasar"){
  const list=activeClaims();
  const rows=rowsFrom(list,[
   h=>pick(h,["dosyaNo","no"],"-"),
   h=>dateVal(h)||"-",
   h=>pick(h,["plaka"],"-"),
   h=>pick(h,["sigorta","sigortaSirketi"],"-"),
   h=>pick(h,["eksper","eksperFirma"],"-"),
   h=>pick(h,["durum","status"],"-")
  ]);
  body=table(["Dosya No","Tarih","Plaka","Sigorta","Eksper","Durum"],rows);
 }

 if(type==="belge"){
  const list=activeDocs();
  const rows=rowsFrom(list,[
   d=>dateVal(d)||"-",
   d=>pick(d,["tur","tip"],"-"),
   d=>pick(d,["belgeAdi","ad","name"],"-"),
   d=>pick(d,["belgeNo","no"],"-"),
   d=>pick(d,["kaynak","source"],"-")
  ]);
  body=table(["Tarih","Tür","Belge","Belge No","Kaynak"],rows);
 }

 if(type==="not"){
  const text=document.getElementById("detailNot")?.value ?? activeCari.notlar ?? "";
  body='<div class="box notes">'+esc(text||"Not yok.").replace(/\n/g,"<br>")+'</div>';
 }

 openReportViewer(title,body);
}

function openReportViewer(title,bodyHtml){
 const viewer=ensureReportViewer();
 const cariName=activeCari?activeCari.name:"";
 const cariCode=activeCari?activeCari.code:"";
 const tableReportTitles=["Cari Hesap Ekstresi","Araçlar","İş Emirleri","Faturalar","Hasar & Sigorta","Belgeler"];
 viewer.classList.toggle("rvFit",tableReportTitles.includes(title));
 viewer.classList.toggle("rvMovement",title==="Cari Hesap Ekstresi");
 viewer.classList.toggle("rvVehicles",title==="Araçlar");
 viewer.classList.toggle("rvWorkOrders",title==="İş Emirleri");
 viewer.classList.toggle("rvInvoices",title==="Faturalar");
 viewer.classList.toggle("rvClaims",title==="Hasar & Sigorta");
 viewer.classList.toggle("rvDocs",title==="Belgeler");
 document.getElementById("rvContent").innerHTML=
  '<h1>MAU OTO SERVİS</h1><h2>'+esc(title)+'</h2>'+
  '<div class="meta"><b>'+esc(cariName)+'</b> · '+esc(cariCode||"-")+'</div>'+
  bodyHtml+
  '<div class="foot">MAU Oto Servis · '+new Date().toLocaleString("tr-TR")+'</div>';
 viewer.style.display="block";
 viewer.scrollTop=0;
}
function closeReportViewer(){
 const viewer=document.getElementById("reportViewer");
 if(viewer)viewer.style.display="none";
 document.body.classList.remove("report-printing");
}
function printReportViewer(){
 const viewer=document.getElementById("reportViewer");
 if(!viewer||viewer.style.display==="none"){alert("Açık rapor bulunamadı.");return;}
 document.body.classList.add("report-printing");

 if(window.MAUAndroid&&typeof window.MAUAndroid.printPage==="function"){
  window.MAUAndroid.printPage();
  setTimeout(function(){document.body.classList.remove("report-printing");},1200);
  return;
 }

 try{
  window.print();
 }finally{
  setTimeout(function(){document.body.classList.remove("report-printing");},800);
 }
}
window.onMauPrintError=function(message){
 document.body.classList.remove("report-printing");
 alert(message||"PDF / yazdırma işlemi başlatılamadı.");
};

window.addEventListener("storage",function(e){
 const watched=[KEYS.cariler].concat(KEYS.araclar,KEYS.isEmirleri,KEYS.faturalar,KEYS.tahsilatlar,KEYS.odemeler,KEYS.hasarlar,KEYS.belgeler,KEYS.legacyHareket);
 if(!watched.includes(e.key))return;
 cariler=loadArray(KEYS.cariler);
 render();
 if(activeCari){
  activeCari=findCari(activeCari.id);
  if(activeCari){updateSummary();showPanel(activePanel);}else{closeDetail();}
 }
});

render();
