<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAU Oto Servis</title>
<script src="lisans.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#18324d;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:58px 20px}
.wrap{width:100%;max-width:560px;text-align:center}
.brand{display:flex;justify-content:center;margin-bottom:28px}
.brand img{width:min(360px,88vw);height:auto;display:block}
h2{font-size:34px;margin:0 0 26px;font-weight:800}
p{font-size:20px;color:#4c5f73;margin:0 0 30px}
button{padding:15px 28px;border:0;border-radius:10px;background:#0b78c8;color:#fff;font-weight:800;font-size:18px;cursor:pointer}
button:active{transform:scale(.98)}
@media(max-width:480px){
  body{padding-top:72px}
  h2{font-size:30px}
  p{font-size:18px}
  button{font-size:17px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="mau-logo-oto-servis-dark.svg" alt="MAU Oto Servis">
  </div>
  <h2>Çıkış yapıldı</h2>
  <p>Verileriniz silinmedi.</p>
  <button onclick="location.href='index.html'">Ana Ekrana Dön</button>
</div>
</body>
</html>
