<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAU Oto Servis - İşçilik Tanımları</title>
<style>
*{box-sizing:border-box}:root{--b:#0874d1;--b2:#083fa7;--g:#0a944a;--bg:#f3f6fb;--line:#d9e1ea;--muted:#64748b}
body{margin:0;font-family:Arial;background:var(--bg);color:#1f2937}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:16px}.head{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center}.back{border:0;background:#ffffff1c;color:#fff;width:42px;height:42px;border-radius:10px;font-size:22px}.title{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.86;margin-top:3px}
.wrap{max-width:1100px;margin:auto;padding:16px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800}.new{background:var(--g);color:#fff}.secondary{background:#eaf2ff;color:#0756a5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;padding:12px;border-radius:12px;text-align:center}.stat b{display:block;font-size:22px;color:#0864b8}.stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #0000000b}.name{font-size:18px;font-weight:900}.meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}.badge{display:inline-block;background:#eaf3ff;color:#075ba8;border-radius:10px;padding:4px 8px;font-size:10px;font-weight:800;margin-right:4px}.actions{display:flex;gap:6px;margin-top:10px}.actions button{border:0;border-radius:8px;padding:8px 10px;font-weight:800}.edit{background:#eaf2ff;color:#0756a5}.pass{background:#fff2df;color:#9b6200}.del{background:#ffe8eb;color:#a21c2b}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;overflow:auto;padding:15px}.box{max-width:760px;background:#fff;margin:20px auto;border-radius:15px;overflow:hidden}.boxHead{background:var(--b);color:#fff;padding:15px 17px;font-weight:900;display:flex;justify-content:space-between}.boxBody{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:9px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:#4b5968}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px}textarea{min-height:75px}.save{width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:14px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}}
</style><script src="lisans.js"></script>
</head><body>
<header><div class="head"><button class="back" onclick="location.href='Personel.html'">‹</button><div><div class="title">M•• MAU OTO SERVİS</div><div class="sub">İşçilik / Hizmet Tanımları · Bölüm · Süre · Fiyat · KDV</div></div></div></header>
<div class="wrap">
 <div class="toolbar"><input id="search" class="search" placeholder="İşçilik adı, kodu veya bölüm ara..." oninput="render()"><button class="btn secondary" onclick="location.href='Personel.html'">Personel / Ustalar</button><button class="btn secondary" onclick="migrateLegacyLaborFromStock(true);render()">Stoktaki İşçilikleri Aktar</button><button class="btn secondary" onclick="separateLaborFromStock()">İşçilikleri Stoktan Ayır</button><button class="btn secondary" onclick="mergeDuplicateStockFromLabor()">Stok Mükerrerlerini Birleştir</button><button class="btn new" onclick="openForm()">+ Yeni İşçilik</button></div>
 <div class="stats"><div class="stat"><b id="total">0</b><span>Toplam</span></div><div class="stat"><b id="active">0</b><span>Aktif</span></div><div class="stat"><b id="mechanic">0</b><span>Mekanik / Bakım</span></div><div class="stat"><b id="body">0</b><span>Kaporta / Boya</span></div></div>
 <div id="list"></div>
</div>
<div id="modal" class="modal"><div class="box"><div class="boxHead"><span id="formTitle">Yeni İşçilik</span><span onclick="closeForm()" style="cursor:pointer">×</span></div><div class="boxBody">
 <div class="grid">
  <div class="field"><label>İşçilik Kodu</label><input id="code" readonly></div>
  <div class="field"><label>Bölüm *</label><select id="department"><option>Mekanik</option><option>Elektrik</option><option>Kaporta</option><option>Boya</option><option>Lastik</option><option>Periyodik Bakım</option><option>Diagnostik</option><option>Diğer</option></select></div>
  <div class="field full"><label>İşçilik / Hizmet Adı *</label><input id="name" placeholder="Örn: Motor yağı ve filtre değişimi"></div>
  <div class="field"><label>Standart Süre (Saat)</label><input id="hours" type="number" min="0" step="0.25"></div>
  <div class="field"><label>Satış Fiyatı (TL)</label><input id="price" type="number" min="0" step="0.01"></div>
  <div class="field"><label>KDV (%)</label><input id="vat" type="number" min="0" value="20"></div>
  <div class="field"><label>Durum</label><select id="status"><option>Aktif</option><option>Pasif</option></select></div>
  <div class="field full"><label>Açıklama / Kontrol Notu</label><textarea id="note" placeholder="İşçilik kapsamı, kontrol listesi, özel not..."></textarea></div>
 </div>
 <button class="save" onclick="save()">✓ İşçilik Tanımını Kaydet</button>
</div></div></div>
<script>
const KEY="mau_iscilik_tanimlari";function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}function put(){localStorage.setItem(KEY,JSON.stringify(items))}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function money(n){return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺"}
function serviceFold(v){return String(v==null?"":v).toLocaleUpperCase("tr-TR").replace(/\s+/g," ").trim()}
const LEGACY_LABOR_MAP={
 "ERA FULL BAKIM":"Periyodik Bakım",
 "ŞARJ DİNAMOSU BAKIM":"Elektrik",
 "WEBOSTA DEMONTE":"Mekanik",
 "BASAMAK YAPIMI":"Kaporta",
 "BASKI BALATA DEĞİŞİM İŞÇİLİK":"Mekanik",
 "BOBİNAJ İŞLEMLERİ":"Elektrik",
 "BOYA İŞÇİLİĞİ":"Boya",
 "CAM SÖK TAK İŞÇİLİK":"Kaporta",
 "DÖŞEME İŞÇİLİK":"Kaporta",
 "ELEKTRİK İŞÇİLİĞİ":"Elektrik",
 "FREN BALATA DEĞİŞİMİ İŞÇİLİK":"Mekanik",
 "İŞÇİLİK":"Diğer",
 "KAPI İŞÇİLİK":"Kaporta",
 "KAPORTA İŞÇİLİĞİ":"Kaporta",
 "KARASÖR TAMİRİ":"Kaporta",
 "KİLİT İŞÇİLİK":"Kaporta",
 "KOLTUK DÜZENLEME":"Kaporta",
 "MAKAS DEĞİSİM İŞÇİLİĞİ":"Mekanik",
 "MAKAS İŞÇİLİĞİ":"Mekanik",
 "MEKANİK İŞÇİLİĞİ":"Mekanik",
 "MOTOR İŞÇİLİK SPRİNTER":"Mekanik",
 "MOTOR REKTEFİYE":"Mekanik",
 "ŞANZIMAN İŞÇİLİK":"Mekanik",
 "ŞASE DÜZELTME İŞÇİLİK":"Kaporta",
 "YAĞ BAKIM İŞÇİLİK":"Periyodik Bakım"
};
function migrateLegacyLaborFromStock(showAlert){
 let stock=[];try{const v=JSON.parse(localStorage.getItem("mau_stok_parcalar")||"[]");stock=Array.isArray(v)?v:[]}catch(e){stock=[]}
 const current=load();
 let maxCode=0;current.forEach(x=>{const n=parseInt(String(x.code||"").replace(/\D/g,""),10);if(Number.isFinite(n)&&n>maxCode)maxCode=n});
 let added=0;
 stock.forEach(function(s){
  const key=serviceFold(s.name),department=LEGACY_LABOR_MAP[key];if(!department)return;
  const sourceId=String(s.legacySourceId||s.id||"");
  const exists=current.some(x=>serviceFold(x.name)===key||(sourceId&&String(x.sourceStockLegacyId||"")===sourceId));
  if(exists)return;
  maxCode++;const now=new Date().toISOString();
  current.unshift({
   id:"LEGACY-LABOR-"+(sourceId||String(Date.now()+added)),
   code:"ISC-"+String(maxCode).padStart(5,"0"),
   department:department,
   name:String(s.name||"").trim(),
   hours:0,
   price:Number(s.salePrice||0),
   vat:Number(s.vat==null?20:s.vat),
   status:"Aktif",
   active:true,
   note:"Eski stok kartından işçilik/hizmet tanımına aktarıldı. Kaynak stok kodu: "+String(s.code||"-")+". Stok kartı silinmedi.",
   sourceStockId:s.id,
   sourceStockCode:s.code||"",
   sourceStockLegacyId:sourceId,
   legacyImportedFromStock:true,
   createdAt:now,
   updatedAt:now
  });added++
 });
 if(added)localStorage.setItem(KEY,JSON.stringify(current));
 items=current;
 if(showAlert)alert(added?added+" işçilik/hizmet stoktan İşçilikler bölümüne eklendi. Stok kartları korunmuştur.":"Aktarılacak yeni işçilik bulunamadı; mevcut tanımlar korunuyor.");
 return added
}
function separateLaborFromStock(){
 let stock=[];try{const v=JSON.parse(localStorage.getItem("mau_stok_parcalar")||"[]");stock=Array.isArray(v)?v:[]}catch(e){stock=[]}
 const services=load(),serviceNames=new Set(services.map(x=>serviceFold(x.name)));
 const laborNames=new Set(Object.keys(LEGACY_LABOR_MAP).map(serviceFold));
 const rows=stock.filter(x=>laborNames.has(serviceFold(x.name))&&serviceNames.has(serviceFold(x.name)));
 if(!rows.length){alert("Stokta ayrılacak işçilik kalmadı.");return}
 if(!confirm(rows.length+" işçilik/hizmet stoktan ayrılacak. İşçilikler bölümündeki kayıtlar korunacak. Devam edilsin mi?"))return;
 let archive=[];try{const v=JSON.parse(localStorage.getItem("mau_stok_iscilik_arsiv")||"[]");archive=Array.isArray(v)?v:[]}catch(e){archive=[]}
 const have=new Set(archive.map(x=>String(x.id)));
 rows.forEach(x=>{if(!have.has(String(x.id)))archive.unshift({...x,archivedAt:new Date().toISOString(),archiveReason:"İşçilik stoktan ayrıldı"})});
 const ids=new Set(rows.map(x=>String(x.id)));
 localStorage.setItem("mau_stok_iscilik_arsiv",JSON.stringify(archive));
 localStorage.setItem("mau_stok_parcalar",JSON.stringify(stock.filter(x=>!ids.has(String(x.id)))));
 alert(rows.length+" işçilik stoktan ayrıldı. İşçilikler bölümündeki tanımlar korunuyor.");
}

function mergeDuplicateStockFromLabor(){
 let stock=[];try{const v=JSON.parse(localStorage.getItem("mau_stok_parcalar")||"[]");stock=Array.isArray(v)?v:[]}catch(e){stock=[]}
 const groups=new Map();
 stock.forEach(x=>{
  const code=serviceFold(x.code||x.barcode),name=serviceFold(x.name);
  if(!code||!name)return;
  const k=code+"||"+name;
  if(!groups.has(k))groups.set(k,[]);
  groups.get(k).push(x);
 });
 const dupGroups=[...groups.values()].filter(g=>g.length>1);
 const extra=dupGroups.reduce((n,g)=>n+g.length-1,0);
 if(!extra){alert("Mükerrer stok kartı bulunmadı.");return}
 if(!confirm(dupGroups.length+" ürün grubunda "+extra+" mükerrer stok kartı birleştirilecek. Miktarlar toplanacak, eski kartlar arşivlenecek. Devam edilsin mi?"))return;
 let archive=[];try{const v=JSON.parse(localStorage.getItem("mau_stok_mukerrer_arsiv")||"[]");archive=Array.isArray(v)?v:[]}catch(e){archive=[]}
 const archived=new Set(archive.map(x=>String(x.id))),removeIds=new Set();
 dupGroups.forEach(g=>{
  const keep=g[0];
  let qty=0,min=0;
  g.forEach(x=>{qty+=Number(x.stock||0);min=Math.max(min,Number(x.minStock||0))});
  keep.stock=qty;keep.minStock=min;keep.updatedAt=new Date().toISOString();
  g.slice(1).forEach(x=>{
    removeIds.add(String(x.id));
    if(!archived.has(String(x.id)))archive.unshift({...x,archivedAt:new Date().toISOString(),archiveReason:"Mükerrer stok kartı birleştirildi"});
  });
 });
 localStorage.setItem("mau_stok_mukerrer_arsiv",JSON.stringify(archive));
 localStorage.setItem("mau_stok_parcalar",JSON.stringify(stock.filter(x=>!removeIds.has(String(x.id)))));
 alert(dupGroups.length+" ürün grubu birleştirildi; "+extra+" mükerrer kart stoktan kaldırıldı.");
}

let items=load(),editId=null;function nextCode(){let m=0;items.forEach(x=>{const n=parseInt(String(x.code||"").replace(/\D/g,""),10);if(Number.isFinite(n)&&n>m)m=n});return "ISC-"+String(m+1).padStart(5,"0")}
function openForm(id){editId=id==null?null:id;const x=editId==null?null:items.find(a=>String(a.id)===String(editId));document.getElementById("formTitle").innerText=x?"İşçilik Düzenle":"Yeni İşçilik";document.getElementById("code").value=x?(x.code||""):nextCode();document.getElementById("department").value=x?(x.department||"Mekanik"):"Mekanik";document.getElementById("name").value=x?(x.name||""):"";document.getElementById("hours").value=x?(x.hours||""):"";document.getElementById("price").value=x?(x.price||""):"";document.getElementById("vat").value=x?(x.vat??20):20;document.getElementById("status").value=x?(x.status||"Aktif"):"Aktif";document.getElementById("note").value=x?(x.note||""):"";document.getElementById("modal").style.display="block"}
function closeForm(){document.getElementById("modal").style.display="none"}
function save(){const name=document.getElementById("name").value.trim();if(!name){alert("İşçilik / hizmet adı giriniz.");return}const old=editId==null?null:items.find(a=>String(a.id)===String(editId));const x={id:old?old.id:Date.now(),code:old?old.code:nextCode(),department:document.getElementById("department").value,name,hours:Number(document.getElementById("hours").value||0),price:Number(document.getElementById("price").value||0),vat:Number(document.getElementById("vat").value||0),status:document.getElementById("status").value,active:document.getElementById("status").value==="Aktif",note:document.getElementById("note").value.trim(),createdAt:old&&old.createdAt?old.createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(old)items[items.findIndex(a=>String(a.id)===String(old.id))]=x;else items.unshift(x);put();closeForm();render()}
function toggle(id){const x=items.find(a=>String(a.id)===String(id));if(!x)return;x.active=!x.active;x.status=x.active?"Aktif":"Pasif";x.updatedAt=new Date().toISOString();put();render()}
function del(id){const x=items.find(a=>String(a.id)===String(id));if(!x)return;if(confirm(x.name+" silinsin mi?")){items=items.filter(a=>String(a.id)!==String(id));put();render()}}
function render(){items=load();const q=document.getElementById("search").value.toLocaleLowerCase("tr-TR").trim();const list=items.filter(x=>!q||[x.code,x.name,x.department].join(" ").toLocaleLowerCase("tr-TR").includes(q));document.getElementById("total").innerText=items.length;document.getElementById("active").innerText=items.filter(x=>x.active!==false).length;document.getElementById("mechanic").innerText=items.filter(x=>["Mekanik","Periyodik Bakım","Diagnostik"].includes(x.department)).length;document.getElementById("body").innerText=items.filter(x=>["Kaporta","Boya"].includes(x.department)).length;const el=document.getElementById("list");if(!list.length){el.innerHTML='<div class="card empty">İşçilik tanımı yok.</div>';return}el.innerHTML=list.map(x=>'<div class="card" style="'+(x.active===false?'opacity:.55':'')+'"><div class="name">'+esc(x.name)+' <span class="badge">'+esc(x.code)+'</span></div><div class="meta">'+esc(x.department)+' · '+(x.hours||0)+' saat · '+money(x.price)+' · KDV %'+Number(x.vat||0)+'</div><div class="actions"><button class="edit" onclick="openForm(&quot;'+x.id+'&quot;)">Düzenle</button><button class="pass" onclick="toggle(&quot;'+x.id+'&quot;)">'+(x.active===false?'Aktif Et':'Pasife Al')+'</button><button class="del" onclick="del(&quot;'+x.id+'&quot;)">Sil</button></div></div>').join("")}
window.addEventListener("click",e=>{if(e.target===document.getElementById("modal"))closeForm()});migrateLegacyLaborFromStock(false);render();
</script></body></html>
